name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: fplinux-release
  queue: max
  cancel-in-progress: false

env:
  FPLINUX_DATA_DIR: ${{ github.workspace }}/.data

jobs:
  prepare-inputs:
    if: github.repository == 'fplinux/fplinux'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.inputs.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: sh .github/scripts/prepare-linux.sh
      - id: inputs
        run: ./fplinux ci prepare-inputs --output-dir "$RUNNER_TEMP/fplinux-inputs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-inputs
          path: ${{ runner.temp }}/fplinux-inputs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  check:
    needs: prepare-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: sh .github/scripts/prepare-linux.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-inputs
          path: ${{ runner.temp }}/fplinux-inputs
      - run: ./fplinux ci restore-inputs --directory "$RUNNER_TEMP/fplinux-inputs" --snapshot "${{ needs.prepare-inputs.outputs.snapshot }}"
      - run: ./fplinux setup --offline
      - run: ./fplinux doctor
      - run: ./fplinux check --no-cache

  build:
    needs: [prepare-inputs, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: sh .github/scripts/prepare-linux.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-inputs
          path: ${{ runner.temp }}/fplinux-inputs
      - run: ./fplinux ci restore-inputs --directory "$RUNNER_TEMP/fplinux-inputs" --snapshot "${{ needs.prepare-inputs.outputs.snapshot }}"
      - run: ./fplinux setup --offline
      - run: ./fplinux doctor
      - run: ./fplinux package --output-directory "$FPLINUX_DATA_DIR/ci/package"
      - run: ./fplinux ci attach-inputs --directory "$FPLINUX_DATA_DIR/ci/package" --inputs-dir "$RUNNER_TEMP/fplinux-inputs" --output-directory "$FPLINUX_DATA_DIR/ci/distribution"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution
          path: ${{ env.FPLINUX_DATA_DIR }}/ci/distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  smoke-linux:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distribution
          path: ${{ env.FPLINUX_DATA_DIR }}/ci/distribution
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y udev iproute2
      - run: sudo install -m 0644 common/60-fplinux.rules /etc/udev/rules.d/60-fplinux.rules
      - run: ./fplinux ci smoke --directory "$FPLINUX_DATA_DIR/ci/distribution" --host linux

  smoke-windows:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distribution
          path: distribution
      - run: .github/scripts/smoke-windows.ps1 -Python (Get-Command python).Source -Checkout $env:GITHUB_WORKSPACE -Distribution (Join-Path $env:GITHUB_WORKSPACE 'distribution')
        shell: pwsh

  publish:
    needs: [check, smoke-linux, smoke-windows]
    if: github.repository == 'fplinux/fplinux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distribution
          path: ${{ env.FPLINUX_DATA_DIR }}/ci/distribution
      - run: ./fplinux ci publish --directory "$FPLINUX_DATA_DIR/ci/distribution" --commit "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: prepare-inputs
    if: github.repository == 'fplinux/fplinux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      snapshot: ${{ needs.prepare-inputs.outputs.snapshot }}
