name: Documentation site

on:
  workflow_call:
    inputs:
      snapshot:
        description: Exact dependency snapshot prepared by this release workflow
        required: true
        type: string

permissions: {}

env:
  FPLINUX_DATA_DIR: ${{ github.workspace }}/.data

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: sh .github/scripts/prepare-linux.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-inputs
          path: ${{ runner.temp }}/fplinux-inputs
      - run: ./fplinux ci restore-inputs --directory "$RUNNER_TEMP/fplinux-inputs" --snapshot "${{ inputs.snapshot }}"
      - run: ./fplinux setup --site --offline
      - run: ./fplinux site check
      - run: ./fplinux site build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
