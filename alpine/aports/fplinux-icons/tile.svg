<svg xmlns="http://www.w3.org/2000/svg" width="$size" height="$size" viewBox="0 0 $size $size">
  <rect width="$size" height="$size" rx="$radius" fill="$colour" />
  <g transform="translate($offset $offset) scale($scale)" color="#FFFFFF" fill="none" stroke="#FFFFFF" stroke-width="$stroke" stroke-linecap="round" stroke-linejoin="round">$glyph</g>
</svg>
