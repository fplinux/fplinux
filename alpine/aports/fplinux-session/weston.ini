[core]
shell=fplinux-shell.so
renderer=pixman
idle-time=0
xwayland=false
require-input=false
gbm-format=rgb565

[keyboard]
keymap_rules=fplinux
keymap_model=pc105
# fplinux-session adds the input languages' registered layouts at start.
keymap_layout=us
keymap_options=group:alt_shift_toggle
# Ctrl+Alt+F1-F8 on an external keyboard must not switch the phone to a text
# console that the keypad cannot leave.
vt-switching=false
