# Convert application PCM to the formats supported by the phone's audio device.
pcm.!default {
	type asym
	playback.pcm {
		@func refer
		name {
			@func concat
			strings [
				"pcm.fplinux-card-playback."
				{ @func card_driver card 0 }
			]
		}
		default {
			type plug
			slave {
				pcm "hw:0,0"
				rate 48000
			}
		}
	}
	capture.pcm {
		type plug
		slave {
			pcm "hw:0,0"
			rate 48000
		}
	}
}

ctl.!default {
	type hw
	card 0
}
