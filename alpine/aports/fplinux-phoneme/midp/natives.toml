  "midp/src/highlevelui/annunciator/include",
  "midp/src/lowlevelui/graphics/include",
  "midp/src/lowlevelui/graphics/gx_putpixel/include",
  "midp/src/lowlevelui/graphics/gx_putpixel/native",
  "midp/src/lowlevelui/graphics_api/include",
  "midp/src/lowlevelui/graphics_api/gxapi_native/native",
