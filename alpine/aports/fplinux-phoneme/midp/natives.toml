# Headless port owned by fplinux-phoneme. The display port (lcdlf_*, the
# screen buffer, foreground display id) and the annunciator are Canvas
# natives in port/canvas/, which the APKBUILD compiles as a source dir.
project = [
  "port/fplinux-pm-midp.c",   # fplinux_pm_midp_init/cleanup, properties
  "port/fplinux-pm-keymap.c", # keymap_* with 2/4/6/8/5 game actions
  "port/fplinux-pm-log.c",    # REPORT_* and pcsl_print to stderr
  "port/fplinux-pm-system.c", # event queue lock, callouts, CLDC fallback off
]
# Written by build-midp-java.py into <out>/c.
generated = [
  "LocalizedStringsBase.c",
  "midp_constants_data.c",
  "properties_static_data.c",
  "NativesTable.cpp",
]
