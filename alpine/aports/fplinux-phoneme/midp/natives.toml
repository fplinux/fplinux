# MIDP native selection for fplinux-phoneme: every native of the generated
# NativesTable.cpp that the CLDC libraries do not define, plus the MIDP and
# PCSL support code those natives call.
#
# Path roots:
#   [include].upstream, [sources].upstream  relative to the patched upstream
#                                            tree root (build-midp-java.py --src)
#   [include].project, [sources].project    relative to this midp/ directory
#   [sources].generated                      relative to <out>/c of
#                                            build-midp-java.py
# Extra include directories the build adds, in this order after the lists
# below: <out>/c (generated headers), the romgen output directory holding
# ROMStructs.h for the same classes.zip, and the CLDC dist/include (kni.h,
# jvm.h, jvmspi.h, sni.h, jvmconfig.h, NativesTable.hpp).
#
# Compile every C source with the common target flags (clang
# --target=armv7-alpine-linux-musleabihf -march=armv7-a -mfpu=vfpv3-d16
# -mfloat-abi=hard -marm -fno-pie -O2 -fno-delete-null-pointer-checks
# -fno-strict-aliasing) plus -std=<c_std>, c_extra and defines; C++ sources
# (*.cpp) get cxx_extra and defines instead. -marm is required: the CLDC ARM
# interpreter calls KNI natives with "mov pc". Link the objects before
# jvmspi.o, ROMImage.o and the CLDC libraries; no -lz is needed.
[flags]
c_std = "gnu99"
c_extra = []
cxx_extra = ["-std=gnu++98", "-fno-rtti", "-fno-exceptions"]
# MIDP configuration: single VM, no CDC, no native AMS/RMS/PTI, no caches, JPEG
# on, MIDP memory pool off (plain malloc), PRODUCT.
defines = [
  "-DPRODUCT",
  "-DUNIX",
  "-DLINUX",
  "-DPROJECT_NAME=\"fplinux-phoneme\"",
  "-DENABLE_CDC=0",
  "-DENABLE_CLDC_11=1",
  "-DENABLE_JPEG=1",
  "-DENABLE_MIDP_MALLOC=0",
  "-DENABLE_IMAGE_CACHE=0",
  "-DENABLE_FONT_CACHE=0",
  "-DENABLE_ICON_CACHE=0",
  "-DENABLE_I3_TEST=0",
  "-DENABLE_NUTS_FRAMEWORK=0",
  "-DENABLE_NETWORK_INDICATOR=0",
  "-DENABLE_MULTIPLE_ISOLATES=0",
  "-DENABLE_MULTIPLE_DISPLAYS=0",
  "-DENABLE_JAVA_DEBUGGER=0",
  "-DENABLE_NATIVE_APP_MANAGER=0",
  "-DENABLE_NATIVE_INSTALLER=0",
  "-DENABLE_NATIVE_SUITE_STORAGE=0",
  "-DENABLE_NATIVE_RMS=0",
  "-DENABLE_NATIVE_PTI=0",
  "-DENABLE_MESSAGE_STRINGS=0",
  "-DENABLE_VM_PROFILES=0",
  "-DENABLE_MONET=0",
  "-DENABLE_SERVER_SOCKET=0",
  "-DENABLE_DIRECT_DRAW=0",
  "-DENABLE_FILE_SYSTEM=1",
  "-DENABLE_ON_DEVICE_DEBUG=0",
  "-DENABLE_WTK_DEBUG=0",
  "-DENABLE_AMS_FOLDERS=0",
  "-DENABLE_OCSP=0",
  "-DENABLE_PUBLIC_AMS_API=0",
  "-DENABLE_DYNAMIC_COMPONENTS=0",
  "-DENABLE_32BITS_PIXEL_FORMAT=0",
]

