version = 1
SPDX-PackageName = "FPLinux"
SPDX-PackageSupplier = "FPLinux contributors"

[[annotations]]
path = [
  ".cache/.fplinux-workspace",
  ".clang-format",
  ".editorconfig",
  ".gitattributes",
  ".githooks/**",
  ".github/**",
  ".gitignore",
  ".markdownlint-cli2.jsonc",
  ".prettierignore",
  ".prettierrc.json",
  ".taplo.toml",
  ".vale.ini",
  "LICENSE",
  "README.md",
  "REUSE.toml",
  "alpine.lock.toml",
  "alpine/**",
  "THIRD_PARTY_NOTICES.md",
  "_typos.toml",
  "bootstrap/**",
  "commitlint.config.mjs",
  "common/**",
  "environment.lock.toml",
  "fplinux",
  "include/**",
  "lib/**",
  "linux-host.lock.toml",
  "package-lock.json",
  "package.json",
  "platforms/**",
  "profiles/**",
  "pyproject.toml",
  "scripts/**",
  "site/**",
  "sources.lock.toml",
  "targets/**",
  "tests/**",
  "windows-host.lock.toml",
  "windows-driver.lock.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
  "scripts/fplinux_cli/build/host_tools/inbox-winusb.patch",
  "scripts/fplinux_cli/build/host_tools/source-date-epoch.patch",
]
precedence = "override"
SPDX-FileCopyrightText = ["2010-2023 Pete Batard", "2026 FPLinux contributors"]
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["site/src/fonts/**", "site/public/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "alpine/aports/fplinux-example-apidemo/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = [
  "alpine/aports/fplinux-example-apidemo/org.fplinux.example.apidemo.png",
  "alpine/aports/fplinux-example-apidemo/org.fplinux.example.apidemo-24.png",
  "alpine/aports/fplinux-example-apidemo/org.fplinux.example.apidemo-60.png",
  "alpine/aports/fplinux-example-apidemo/lists-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/forms-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/commands-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/canvas-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/look-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/locale-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/lifecycle-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/sound-symbolic.png",
  "alpine/aports/fplinux-example-apidemo/LICENSE-tabler",
]
precedence = "override"
SPDX-FileCopyrightText = ["2020-2026 Paweł Kuna", "2026 FPLinux contributors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "alpine/aports/fplinux-tyrquake/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "alpine/aports/fplinux-libudev/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "alpine/aports/fplinux-libtsm/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "MIT"

# SPDX comments in diff context describe upstream files, not the patch itself.
[[annotations]]
path = ["platforms/*/linux/patches/*.patch", "targets/*/linux/patches/*.patch"]
precedence = "override"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "third-party-licenses/musl/COPYRIGHT"
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# Embedded identifiers describe quoted upstream notices, not this collection.
[[annotations]]
path = "alpine/aports/fplinux-mesa/NOTICE"
precedence = "override"
SPDX-FileCopyrightText = "2026 FPLinux contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "platforms/ums9117/bootstrap/build/ums9117-linux.ld"
precedence = "override"
SPDX-FileCopyrightText = "fpdoom contributors"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "targets/*/bootstrap/lcd_config.h"
precedence = "override"
SPDX-FileCopyrightText = "fpdoom contributors"
SPDX-License-Identifier = "Unlicense"

# Preserve original fixture bytes and express their license with its current identifier.
[[annotations]]
path = [
  "tests/host_tool/sc27xx/rtc-sc27xx.c.fixture",
  "tests/host_tool/sc27xx/sc2731-regulator.c.fixture",
  "tests/host_tool/sc9820e/poweroff/spi-sprd-adi.c.fixture",
]
precedence = "override"
SPDX-FileCopyrightText = "2017 Spreadtrum Communications Inc."
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "tests/host_tool/sc27xx/efuse/sprd-efuse.c.fixture"
precedence = "override"
SPDX-FileCopyrightText = "2019 Spreadtrum Communications Inc."
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "tests/host_tool/sc9820e/clocks/gpio-source/gpio-sprd.c.fixture"
precedence = "override"
SPDX-FileCopyrightText = [
  "2018 Spreadtrum Communications Inc.",
  "2018 Linaro Ltd.",
]
SPDX-License-Identifier = "GPL-2.0-only"
