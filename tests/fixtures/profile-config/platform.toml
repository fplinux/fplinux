[identity]
compatible = "demo,soc"

[rootfs]
packages = ["fplinux-feature", "fplinux-ssh"]

[uboot]
source = "platforms/demo/uboot.lock.toml"
archive_prefix = "u-boot-2026.07"
patches = []
required_config = ["CONFIG_TARGET_DEMO=y"]
copies = []

[linux]
defconfig = "platforms/demo/kernel/defconfig"
dt_config_checks = []

[bootstrap]
kernel_destination = "zImage"
toolchain = "toolchain"
lto = 0
load_address = 0x80100000
payload_limit = 0x82000000
backend = "ums9117"

[bootstrap.layout]
ram_base = 0x80000000
ram_size = 0x04000000
kernel_load = 0x82000000
kernel_entry = 0x82000000
kernel_size = 0x01200000
fdt_load = 0x83e00000
fdt_size = 0x00010000
framebuffer = 0x83f00000
framebuffer_size = 0x00100000
timer_hz = 1000

[runtime]
fdl1_load_address = 0
adapter = {}
usb = {}
