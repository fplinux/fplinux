%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/fplinux,qin1splus-musb-inherited.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qin 1s+ inherited MUSB peripheral controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  The RAM boot path must provide the controller clocks, PHY power and
  stopped DMA channels before Linux takes ownership. The glue uses
  programmed I/O and supports peripheral mode only; it does not initialize
  the clocks or PHY.

properties:
  compatible:
    const: fplinux,qin1splus-musb-inherited

  reg:
    maxItems: 1
    description: The 0x2000-byte MUSB controller register block.

  interrupts:
    maxItems: 1

  interrupt-names:
    const: mc

  dr_mode:
    const: peripheral

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - dr_mode

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    usb@20200000 {
        compatible = "fplinux,qin1splus-musb-inherited";
        reg = <0x20200000 0x2000>;
        interrupts = <GIC_SPI 55 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "mc";
        dr_mode = "peripheral";
    };
