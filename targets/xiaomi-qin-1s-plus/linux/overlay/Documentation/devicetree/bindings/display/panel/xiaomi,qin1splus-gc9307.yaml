%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,qin1splus-gc9307.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qin 1s+ GC9307 display

maintainers:
  - FPLinux <fplinux@users.noreply.github.com>

allOf:
  - $ref: panel-common.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: xiaomi,qin1splus-gc9307

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 96000000

  dc-gpios:
    maxItems: 1
    description: Data/command selection, high for data.

  te-gpios:
    maxItems: 1
    description: Display synchronization input, sampled on its physical rising edge.

  write-only:
    type: boolean
    description: Only display writes are supported.

  format:
    const: r5g6b5

  width-mm:
    description: Physical display width, zero if unknown.

  height-mm:
    description: Physical display height, zero if unknown.

required:
  - compatible
  - reg
  - spi-max-frequency
  - dc-gpios
  - reset-gpios
  - write-only
  - backlight
  - format
  - width-mm
  - height-mm
  - panel-timing

unevaluatedProperties: false
