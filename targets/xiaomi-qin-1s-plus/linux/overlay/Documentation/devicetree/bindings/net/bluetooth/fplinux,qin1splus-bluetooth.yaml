%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/fplinux,qin1splus-bluetooth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qin 1s+ shared-buffer Bluetooth endpoint

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Fixed board Bluetooth endpoint using the existing WCN transport and BTWF
  power owner. Registering the HCI device schedules native controller setup.

properties:
  $nodename:
    const: bluetooth

  compatible:
    const: fplinux,qin1splus-bluetooth

  remoteproc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The Qin BTWF remote processor supplying the power reference.

  fplinux,sipc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The single fixed shared-buffer owner.

required:
  - compatible
  - remoteproc
  - fplinux,sipc

additionalProperties: false
