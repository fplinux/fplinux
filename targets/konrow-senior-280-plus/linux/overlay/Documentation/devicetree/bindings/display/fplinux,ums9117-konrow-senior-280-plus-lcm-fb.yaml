# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/display/fplinux,ums9117-konrow-senior-280-plus-lcm-fb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Konrow Senior 280 Plus UMS9117 LCDC display

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  The DBI display uses PWM to vary brightness on a single white WLED channel
  with a fixed current.

allOf:
  - $ref: /schemas/display/fplinux,ums9117-fb-common.yaml#

properties:
  compatible:
    const: fplinux,ums9117-konrow-senior-280-plus-lcm-fb

  reg: true

  reg-names:
    contains:
      const: lcm-data

  sprd,wled-current-levels:
    items:
      - const: 0
      - const: 0
      - const: 0
      - minimum: 1
        maximum: 63
    description: Fixed current of the white channel. RGB channels are off.

  sprd,wled-default-level:
    minimum: 1
    maximum: 255
    description: Initial PWM duty.

required:
  - compatible

unevaluatedProperties: false
