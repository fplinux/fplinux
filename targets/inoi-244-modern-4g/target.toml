# SPDX-License-Identifier: GPL-2.0-only
platform = "ums9117"

[identity]
brand = "INOI"
product = "244 Modern 4G"
hardware_codes = []
compatible = "inoi,244-modern-4g"

[nand]
raw_device = "/dev/ums9117-nand-raw"
id = 0x21e5
raw_page_bytes = 2112

[display]
panel = "display/panel.toml"
boot_font = "7x14"

[display_brightness]
backlight = "inoi244-backlight"
levels = [0, 2, 5, 8, 10, 12, 15, 18, 20, 21, 24]

[rootfs]
packages = ["fplinux-audio", "fplinux-font-terminus-8x16", "fplinux-jack"]

[bundle]
packages = []

[linux]
config_fragment = "linux/config/config.fragment"
memory = { base = 0x80200000, size = 0x03c00000 }
dtb = "unisoc/ums9117-inoi-244-modern-4g.dtb"
debug_dtb = "ums9117-inoi-244-modern-4g.dtb"
patches = []
forbidden_dtb_markers = ["spi-nand", "mtd", "ubi", "emmc"]
forbidden_config = [
  "CONFIG_MMC_REMOVABLE=y",
  "CONFIG_MMC_GPIO=y",
  "CONFIG_GPIO_EIC_SPRD=y",
  "CONFIG_GPIO_EIC_SPRD=m",
  "CONFIG_MTD=y",
  "CONFIG_UBI=y",
  "CONFIG_SCSI=y",
  "CONFIG_ATA=y",
  "CONFIG_NVME_CORE=y",
]
overlay = "linux/overlay"
copies = []

[[linux.appends]]
source = "linux/fragments/dts/unisoc.Makefile"
destination = "arch/arm/boot/dts/unisoc/Makefile"

[[linux.appends]]
source = "linux/fragments/arch/arm/mach-ums9117/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "linux/fragments/drivers/gpu/drm/ums9117/drm.Kconfig"
destination = "drivers/gpu/drm/Kconfig"

[[linux.appends]]
source = "linux/fragments/drivers/gpu/drm/ums9117/drm.Makefile"
destination = "drivers/gpu/drm/ums9117/Makefile"

[bootstrap]
lcd_config = "bootstrap/lcd_config.h"
image = "inoi244_linux_bootstrap.bin"
map = "obj/inoi244_linux_bootstrap_map.txt"
dtb_destination = "inoi244.dtb"
record_prefix = "INOI244"

[adapter]
spi_mode = 3
backlight_channels = "rgb"
backlight_level = 0x12
exec_distance = 0
session_name = "inoi244-linux"
boot_instructions = "Power the phone off, hold *, then connect USB while keeping * pressed."

[loader_maps]
pinmap = { member = "inoi_244/pinmap.bin", sha256 = "044e79980d5994fce3a9075e7a39b34791ba8b925911df61ea86c5665705552b" }
keymap = { member = "inoi_244/keymap.bin", sha256 = "d7414fcc64cdc1aa1d61d6e63327a78db2d54d80b8134bf5e64b5316ff06073c" }

[device_data]
parser = "inoi244_device_data.py"

[bluetooth]
firmware = [
  { source = "inoi244-cm4.bin", destination = "ums9117/inoi244-cm4.bin" },
  { source = "inoi244-bt-config.bin", destination = "ums9117/inoi244-bt-config.bin", size = 8 },
  { source = "inoi244-bt-sprd.bin", destination = "ums9117/inoi244-bt-sprd.bin", size = 176 },
  { source = "inoi244-bt-rf-config.bin", destination = "ums9117/inoi244-bt-rf-config.bin", size = 252 },
]

[audio_profile]
speaker_vibration = true
firmware = [
  { source = "inoi244-audio-profile.bin", destination = "fplinux/inoi244-audio-profile.bin", size = 822 },
]

[fm_radio]
firmware = [
  { source = "inoi244-fm-config.bin", destination = "fplinux/inoi244-fm-config.bin", size = 128 },
]

[microsd]
linux_patches = []

[microsd.bootstrap]
source = "bootstrap-microsd"
image = "inoi244_sd_stage0.bin"
map = "obj/inoi244_sd_stage0_map.txt"

[microsd.uboot]
defconfig = "uboot/inoi244_defconfig"
patches = []

[[microsd.uboot.copies]]
source = "targets/inoi-244-modern-4g/uboot/ums9117-inoi244-u-boot.dts"
destination = "arch/arm/dts/ums9117-inoi244-u-boot.dts"
