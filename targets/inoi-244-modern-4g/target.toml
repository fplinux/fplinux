# SPDX-License-Identifier: GPL-2.0-only
platform = "ums9117"

[identity]
brand = "INOI"
product = "244 Modern 4G"
hardware_codes = []
compatible = "inoi,244-modern-4g"

[nand]
raw_device = "/dev/ums9117-nand-raw"
id = 0x21e5
raw_page_bytes = 2112

[rootfs]
packages = ["fplinux-audio"]

[bundle]
packages = []

[linux]
config_fragment = "kernel/config.fragment"
memory = { base = 0x80200000, size = 0x03c00000 }
dtb = "unisoc/ums9117-inoi-244-modern-4g.dtb"
debug_dtb = "ums9117-inoi-244-modern-4g.dtb"
patches = ["kernel/0001-inoi-244-modern-4g-dtb.patch"]
forbidden_dtb_markers = ["spi-nand", "mtd", "ubi", "emmc"]
forbidden_config = [
  "CONFIG_MTD=y",
  "CONFIG_UBI=y",
  "CONFIG_SCSI=y",
  "CONFIG_ATA=y",
  "CONFIG_NVME_CORE=y",
  "CONFIG_DEVMEM=y",
]

[[linux.copies]]
source = "dts/ums9117-inoi-244-modern-4g.dts"
destination = "arch/arm/boot/dts/unisoc/ums9117-inoi-244-modern-4g.dts"

[[linux.copies]]
source = "dts/nand-readonly.dtsi"
destination = "arch/arm/boot/dts/unisoc/inoi-244-modern-4g-nand-readonly.dtsi"

[[linux.copies]]
source = "dts/bluetooth.dtsi"
destination = "arch/arm/boot/dts/unisoc/inoi-244-modern-4g-bluetooth.dtsi"

[[linux.copies]]
source = "kernel/inoi244-fb.c"
destination = "drivers/video/fbdev/inoi244-fb.c"

[[linux.appends]]
source = "kernel/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "kernel/fbdev.Kconfig"
destination = "drivers/video/fbdev/Kconfig"

[[linux.appends]]
source = "kernel/fbdev.Makefile"
destination = "drivers/video/fbdev/Makefile"

[bootstrap]
image = "inoi244_linux_bootstrap.bin"
map = "obj/inoi244_linux_bootstrap_map.txt"
dtb_destination = "inoi244.dtb"
record_prefix = "INOI244"

[adapter]
spi_mode = 3
lcd_id = 0x303001
exec_distance = 0
backlight_channels = "rgb"
backlight_level = 0x1f
session_name = "inoi244-linux"
boot_instructions = "Power the phone off, hold *, then connect USB while keeping * pressed."

[device_data]
parser = "inoi244_device_data.py"

[bluetooth]
firmware = [
  { source = "inoi244-cm4.bin", destination = "ums9117/inoi244-cm4.bin", size = 463296, sha256 = "7fd7d006a27276c038962fb1de5ab8f3fc60f9754dc3292427caec068f9af3fd" },
  { source = "inoi244-bt-config.bin", destination = "ums9117/inoi244-bt-config.bin", size = 8 },
  { source = "inoi244-bt-sprd.bin", destination = "ums9117/inoi244-bt-sprd.bin", size = 176 },
  { source = "inoi244-bt-rf-config.bin", destination = "ums9117/inoi244-bt-rf-config.bin", size = 252 },
]

[audio_profile]
firmware = [
  { source = "inoi244-audio-profile.bin", destination = "fplinux/inoi244-audio-profile.bin", size = 43 },
]

[microsd]
linux_patches = []

[microsd.bootstrap]
source = "bootstrap-microsd"
image = "inoi244_sd_stage0.bin"
map = "obj/inoi244_sd_stage0_map.txt"

[microsd.uboot]
defconfig = "uboot/inoi244_defconfig"
patches = []

[[microsd.uboot.copies]]
source = "targets/inoi-244-modern-4g/uboot/ums9117-inoi244-u-boot.dts"
destination = "arch/arm/dts/ums9117-inoi244-u-boot.dts"
