# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/sprd,marlin2-sdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marlin2 external radio on SDIO

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  A fixed SDIO function with firmware loaded into volatile memory. The board
  owns its power and reset controls. Its configuration and calibration are
  provided together as a firmware-loader file prepared from the phone's data.

properties:
  compatible:
    const: sprd,marlin2-sdio

  reg:
    maxItems: 1

  firmware-name:
    description: Firmware-loader name of the external radio image.
    $ref: /schemas/types.yaml#/definitions/string

  calibration-name:
    description: Firmware-loader name of the fitted configuration and calibration.
    $ref: /schemas/types.yaml#/definitions/string

required:
  - compatible
  - reg
  - firmware-name
  - calibration-name

additionalProperties: false

examples:
  - |
    mmc {
        #address-cells = <1>;
        #size-cells = <0>;

        radio@1 {
            compatible = "sprd,marlin2-sdio";
            reg = <1>;
            firmware-name = "ums9117/bq-2830l-tank-connect-max-wcn.bin";
            calibration-name = "ums9117/bq-2830l-tank-connect-max-wcn-calibration.bin";
        };
    };
...
