# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/bq,2830l-radio-pins.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BQ 2830L external radio pin-control registers

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  The external radio controller accesses the board pin-control registers through
  a syscon regmap.

allOf:
  - $ref: syscon-common.yaml#

properties:
  compatible:
    items:
      - const: bq,2830l-radio-pins
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    radio_pins: syscon@402a0000 {
        compatible = "bq,2830l-radio-pins", "syscon";
        reg = <0x402a0000 0x800>;
    };
...
