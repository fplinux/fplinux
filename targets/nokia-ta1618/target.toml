# SPDX-License-Identifier: GPL-2.0-only
platform = "ums9117"

[identity]
brand = "Nokia"
product = "3210 4G"
hardware_codes = ["TA-1618"]
compatible = "nokia,ta-1618"

[nand]
raw_device = "/dev/ums9117-nand-raw"
id = 0xb1a1
raw_page_bytes = 2176

[rootfs]
packages = ["fplinux-audio"]

[bundle]
packages = []

[linux]
config_fragment = "kernel/config.fragment"
memory = { base = 0x80200000, size = 0x03c00000 }
dtb = "unisoc/ums9117-nokia-ta1618.dtb"
debug_dtb = "ums9117-nokia-ta1618.dtb"
patches = ["kernel/0001-nokia-ta1618-board.patch"]
# Only the removable microSD is writable. Internal NAND has a fixed-command
# read-only interface, without an MTD or generic SPI controller.
forbidden_dtb_markers = ["spi-nand", "mtd", "ubi", "emmc"]
forbidden_config = [
  "CONFIG_MTD=y",
  "CONFIG_UBI=y",
  "CONFIG_SCSI=y",
  "CONFIG_ATA=y",
  "CONFIG_NVME_CORE=y",
  "CONFIG_DEVMEM=y",
]

[[linux.copies]]
source = "dts/nand-readonly.dtsi"
destination = "arch/arm/boot/dts/unisoc/nokia-ta1618-nand-readonly.dtsi"

[[linux.copies]]
source = "dts/bluetooth.dtsi"
destination = "arch/arm/boot/dts/unisoc/nokia-ta1618-bluetooth.dtsi"

[[linux.copies]]
source = "kernel/ta1618-fb.c"
destination = "drivers/video/fbdev/ta1618-fb.c"

[[linux.copies]]
source = "dts/ums9117-nokia-ta1618.dts"
destination = "arch/arm/boot/dts/unisoc/ums9117-nokia-ta1618.dts"

[[linux.appends]]
source = "kernel/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "kernel/fbdev.Makefile"
destination = "drivers/video/fbdev/Makefile"

[bootstrap]
image = "ta1618_linux_bootstrap.bin"
map = "obj/ta1618_linux_bootstrap_map.txt"
dtb_destination = "ta1618.dtb"
record_prefix = "TA1618"

[adapter]
spi_mode = 1
lcd_id = 0x8888b6
exec_distance = 0x314d
backlight_channels = "rgbw"
backlight_level = 0x14
session_name = "ta1618-linux"
boot_instructions = "Power the phone off, hold *, then connect USB while keeping * pressed."

[device_data]
parser = "ta1618_device_data.py"

[bluetooth]
firmware = [
  { source = "ta1618-cm4.bin", destination = "ums9117/ta1618-cm4.bin", size = 463468, sha256 = "2288d4979f056b200bbcf341921730a600cd94ff3d1afb14ee1e76d505539535" },
  { source = "ta1618-bt-config.bin", destination = "ums9117/ta1618-bt-config.bin", size = 8 },
  { source = "ta1618-bt-sprd.bin", destination = "ums9117/ta1618-bt-sprd.bin", size = 176 },
  { source = "ta1618-bt-rf-config.bin", destination = "ums9117/ta1618-bt-rf-config.bin", size = 252 },
]

[audio_profile]
firmware = [
  { source = "ta1618-audio-profile.bin", destination = "fplinux/ta1618-audio-profile.bin", size = 43 },
]

[microsd]
linux_patches = []

[microsd.bootstrap]
source = "bootstrap-microsd"
image = "ta1618_sd_stage0.bin"
map = "obj/ta1618_sd_stage0_map.txt"

[microsd.uboot]
defconfig = "uboot/ta1618_defconfig"
patches = []

[[microsd.uboot.copies]]
source = "targets/nokia-ta1618/uboot/ums9117-ta1618-u-boot.dts"
destination = "arch/arm/dts/ums9117-ta1618-u-boot.dts"
