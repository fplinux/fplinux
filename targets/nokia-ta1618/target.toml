# SPDX-License-Identifier: GPL-2.0-only
platform = "ums9117"

[identity]
brand = "Nokia"
product = "3210 4G"
hardware_codes = ["TA-1618"]
compatible = "nokia,ta-1618"

[bundle]
packages = ["fplinux-micropythonos-nokia-ta1618"]

[linux]
dtb = "unisoc/ums9117-nokia-ta1618.dtb"
debug_dtb = "ums9117-nokia-ta1618.dtb"
patches = [
  "kernel/0001-nokia-ta1618-board.patch",
  "kernel/0003-nokia-ta1618-kpled.patch",
  "kernel/0004-nokia-ta1618-usb-regulator.patch",
]
# The DTB must never describe internal storage or a generic SDHCI host; the
# removable microSD slot is the only storage this target may reach.
forbidden_dtb_markers = ["sdhci", "nand", "mtd", "ubi", "emmc"]
forbidden_config = [
  "CONFIG_MTD=y",
  "CONFIG_UBI=y",
  "CONFIG_SCSI=y",
  "CONFIG_ATA=y",
  "CONFIG_NVME_CORE=y",
  "CONFIG_DEVMEM=y",
  "CONFIG_MMC_SDHCI=y",
]

[[linux.copies]]
source = "kernel/ta1618-poweroff.c"
destination = "arch/arm/mach-ums9117/ta1618-poweroff.c"

[[linux.copies]]
source = "kernel/ta1618-mmc-linux.c"
destination = "drivers/mmc/host/ta1618-mmc-linux.c"

[[linux.copies]]
source = "common/ta1618-sdio-board.h"
destination = "drivers/mmc/host/ta1618-sdio-board.h"

[[linux.copies]]
source = "common/ta1618-sdio-board.c"
destination = "drivers/mmc/host/ta1618-sdio-board.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-mmc.yaml"
destination = "Documentation/devicetree/bindings/mmc/fplinux,ta1618-mmc.yaml"

[[linux.copies]]
source = "kernel/ta1618-fb.c"
destination = "drivers/video/fbdev/ta1618-fb.c"

[[linux.copies]]
source = "kernel/leds-ta1618-kpled.c"
destination = "drivers/leds/leds-ta1618-kpled.c"

[[linux.copies]]
source = "kernel/ta1618-sc2720-vibrator.c"
destination = "drivers/input/misc/ta1618-sc2720-vibrator.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-sc2720-vibrator.yaml"
destination = "Documentation/devicetree/bindings/input/fplinux,ta1618-sc2720-vibrator.yaml"

[[linux.copies]]
source = "kernel/sc2720-usb33-regulator.c"
destination = "drivers/regulator/sc2720-usb33.c"

[[linux.copies]]
source = "kernel/ta1618-sc2720-charger.c"
destination = "drivers/power/supply/ta1618-sc2720-charger.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-sc2720-charger.yaml"
destination = "Documentation/devicetree/bindings/power/supply/fplinux,ta1618-sc2720-charger.yaml"

[[linux.copies]]
source = "kernel/ta1618-sc2720-fgu.c"
destination = "drivers/power/supply/ta1618-sc2720-fgu.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-sc2720-fgu.yaml"
destination = "Documentation/devicetree/bindings/power/supply/fplinux,ta1618-sc2720-fgu.yaml"

[[linux.copies]]
source = "kernel/ta1618-thm1.c"
destination = "drivers/thermal/ta1618-thm1.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-thm1.yaml"
destination = "Documentation/devicetree/bindings/thermal/fplinux,ta1618-thm1.yaml"

[[linux.copies]]
source = "kernel/ta1618-sc2720-auxadc.c"
destination = "drivers/iio/adc/ta1618-sc2720-auxadc.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-sc2720-auxadc.yaml"
destination = "Documentation/devicetree/bindings/iio/adc/fplinux,ta1618-sc2720-auxadc.yaml"

[[linux.copies]]
source = "kernel/ta1618-sc2720-rtc.c"
destination = "drivers/rtc/ta1618-sc2720-rtc.c"

[[linux.copies]]
source = "bindings/fplinux,ta1618-sc2720-rtc.yaml"
destination = "Documentation/devicetree/bindings/rtc/fplinux,ta1618-sc2720-rtc.yaml"

[[linux.copies]]
source = "bindings/fplinux,ta1618-kpled.yaml"
destination = "Documentation/devicetree/bindings/leds/fplinux,ta1618-kpled.yaml"

[[linux.copies]]
source = "bindings/fplinux,sc2720-usb33-regulator.yaml"
destination = "Documentation/devicetree/bindings/regulator/fplinux,sc2720-usb33-regulator.yaml"

[[linux.copies]]
source = "dts/ums9117-nokia-ta1618.dts"
destination = "arch/arm/boot/dts/unisoc/ums9117-nokia-ta1618.dts"

[[linux.appends]]
source = "kernel/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "kernel/Makefile"
destination = "arch/arm/mach-ums9117/Makefile"

[[linux.appends]]
source = "kernel/fbdev.Makefile"
destination = "drivers/video/fbdev/Makefile"

[[linux.appends]]
source = "kernel/power-supply.Kconfig"
destination = "drivers/power/supply/Kconfig"

[[linux.appends]]
source = "kernel/power-supply.Makefile"
destination = "drivers/power/supply/Makefile"

[[linux.appends]]
source = "kernel/thermal.Kconfig"
destination = "drivers/thermal/Kconfig"

[[linux.appends]]
source = "kernel/thermal.Makefile"
destination = "drivers/thermal/Makefile"

[[linux.appends]]
source = "kernel/iio.Kconfig"
destination = "drivers/iio/adc/Kconfig"

[[linux.appends]]
source = "kernel/iio.Makefile"
destination = "drivers/iio/adc/Makefile"

[[linux.appends]]
source = "kernel/input.Kconfig"
destination = "drivers/input/misc/Kconfig"

[[linux.appends]]
source = "kernel/input.Makefile"
destination = "drivers/input/misc/Makefile"

[[linux.appends]]
source = "kernel/rtc.Kconfig"
destination = "drivers/rtc/Kconfig"

[[linux.appends]]
source = "kernel/rtc.Makefile"
destination = "drivers/rtc/Makefile"

[bootstrap]
image = "ta1618_linux_bootstrap.bin"
map = "obj/ta1618_linux_bootstrap_map.txt"
dtb_destination = "ta1618.dtb"
record_prefix = "TA1618"

[adapter]
spi_mode = 1
lcd_id = 0x8888b6
exec_distance = 0x314d
backlight_channels = "rgbw"
backlight_level = 0x14
session_name = "ta1618-linux"
boot_instructions = "Power the phone off, hold *, then connect USB while keeping * pressed."
