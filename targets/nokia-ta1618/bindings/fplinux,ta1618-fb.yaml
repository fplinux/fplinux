%YAML 1.2
---
$id: http://devicetree.org/schemas/display/fplinux,ta1618-fb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nokia TA-1618 framebuffer and ST7789P3 panel

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Board-specific fbdev device that resets and initializes the TA-1618 display
  pins, controller blocks and ST7789P3 panel. The first region is reserved
  no-map RAM holding two user-visible RGB565 pages and a private LCDC transfer
  page. AP AHB SET/CLEAR aliases are shared with other board devices; the
  driver writes only its dedicated write-one bits.

properties:
  compatible:
    const: fplinux,ta1618-fb

  reg:
    items:
      - description: reserved RGB565 display memory holding three pages
      - description: LCDC register block
      - description: SPI1 register block
      - description: shared ADI controller register block
      - description: shared PMIC analog-slave register block
      - description: LCM register block
      - description: SPI1 clock source selector
      - description: SPI1 reset write-one SET alias
      - description: SPI1 reset write-one CLEAR alias
      - description: shared AP AHB gate write-one SET alias
      - description: shared AP AHB reset write-one SET alias
      - description: shared AP AHB reset write-one CLEAR alias
      - description: display pin function registers
      - description: display pin electrical configuration registers

  reg-names:
    items:
      - const: framebuffer
      - const: lcdc
      - const: spi
      - const: adi-controller
      - const: analog-slave
      - const: lcm
      - const: spi-clock-selector
      - const: spi-reset-set
      - const: spi-reset-clear
      - const: ap-ahb-gate-set
      - const: ap-ahb-reset-set
      - const: ap-ahb-reset-clear
      - const: pinmux
      - const: pinconf

  interrupts:
    maxItems: 1

  interrupt-names:
    const: lcdc-done

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon providing SPI1 gate and panel reset aliases

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - sprd,aon-apb

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    display@83f00000 {
        compatible = "fplinux,ta1618-fb";
        reg = <0x83f00000 0x100000>,
              <0x20800000 0x1000>,
              <0x70b00000 0x1000>,
              <0x40600000 0x400>,
              <0x40608000 0x1000>,
              <0x20a00000 0x1000>,
              <0x21500054 0x4>,
              <0x71301004 0x4>,
              <0x71302004 0x4>,
              <0x20e01000 0x4>,
              <0x20e01004 0x4>,
              <0x20e02004 0x4>,
              <0x402a00b0 0x1c>,
              <0x402a04b0 0x1c>;
        reg-names = "framebuffer", "lcdc", "spi", "adi-controller",
                    "analog-slave", "lcm", "spi-clock-selector",
                    "spi-reset-set", "spi-reset-clear", "ap-ahb-gate-set",
                    "ap-ahb-reset-set", "ap-ahb-reset-clear", "pinmux",
                    "pinconf";
        interrupts = <GIC_SPI 19 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "lcdc-done";
        sprd,aon-apb = <&aon_apb>;
    };
