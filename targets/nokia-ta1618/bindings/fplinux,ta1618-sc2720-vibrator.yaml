%YAML 1.2
---
$id: http://devicetree.org/schemas/input/fplinux,ta1618-sc2720-vibrator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nokia TA-1618 SC2720 vibrator

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Board-specific force-feedback device for the vibrator output in the SC2720
  analog die. The driver accesses the register through the shared UMS9117 ADI
  provider and owns only the voltage and power-down fields in VIBR_CTRL0.

properties:
  compatible:
    const: fplinux,ta1618-sc2720-vibrator

  reg:
    maxItems: 1

  fplinux,voltage-code:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7
    description: SC2720 VDDVIB voltage code used while the output is active

required:
  - compatible
  - reg
  - fplinux,voltage-code

additionalProperties: false

examples:
  - |
    vibrator@40608e00 {
        compatible = "fplinux,ta1618-sc2720-vibrator";
        reg = <0x40608e00 0x4>;
        fplinux,voltage-code = <0>;
    };
