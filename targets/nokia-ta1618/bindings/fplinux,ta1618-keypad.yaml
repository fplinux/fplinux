%YAML 1.2
---
$id: http://devicetree.org/schemas/input/fplinux,ta1618-keypad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nokia TA-1618 polled keypad

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Polled input device of the Nokia 3210 4G (TA-1618). The Spreadtrum
  keypad controller scans the 5x5 matrix, and the physical 8 key is
  sampled read-only from inherited analog EIC9 state through the shared
  ADI transport.

properties:
  compatible:
    const: fplinux,ta1618-keypad

  reg:
    items:
      - description: Spreadtrum keypad controller
      - description: shared ADI transport

  reg-names:
    items:
      - const: keypad
      - const: adi

  sprd,eic-data-address:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: ADI read target that holds the analog EIC9 key state

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon that gates the keypad block

required:
  - compatible
  - reg
  - reg-names
  - sprd,eic-data-address
  - sprd,aon-apb

additionalProperties: false

examples:
  - |
    keypad@40250000 {
        compatible = "fplinux,ta1618-keypad";
        reg = <0x40250000 0x100>,
              <0x40600000 0x1000>;
        reg-names = "keypad", "adi";
        sprd,eic-data-address = <0x40608280>;
        sprd,aon-apb = <&aon_apb>;
    };
