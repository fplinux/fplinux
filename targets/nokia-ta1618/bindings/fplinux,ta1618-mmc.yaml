%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/fplinux,ta1618-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nokia TA-1618 removable microSD host

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Host for the removable microSD slot on the Nokia 3210 4G (TA-1618), driving
  the UMS9117 SDIO0 instance. The block shares the command, response,
  interrupt and ADMA2 layout of an SDHCI controller but is not one. The
  register at offset 0x28 is a 32-bit custom host control word and there is no
  SDHCI power control byte, so the driver programs the proven board recipe
  directly. The phone's internal storage is raw NAND on a different
  controller and is not reachable through this node.

  Every window the driver needs is named individually, because the bring-up
  recipe spans the AP AHB gates, the AP clock selector, the SDIO0 registers,
  the pin controller pads, the analog die interface and the EIC2 card-detect
  registers. The driver validates each window against a compile-time table and
  refuses to probe on any mismatch.

properties:
  compatible:
    const: fplinux,ta1618-mmc

  reg:
    minItems: 43
    maxItems: 43

  reg-names:
    items:
      - const: gate-state
      - const: gate-set
      - const: gate-clear
      - const: ap-reset-state
      - const: ap-reset-set
      - const: ap-reset-clear
      - const: ap-clock-selector
      - const: block-count
      - const: block-size
      - const: present-state
      - const: host-control1
      - const: clock-timeout-reset
      - const: argument
      - const: transfer-command
      - const: response0
      - const: response1
      - const: response2
      - const: response3
      - const: interrupt-status
      - const: interrupt-status-enable
      - const: interrupt-signal-enable
      - const: adma-error
      - const: adma2-address-low
      - const: adma2-address-high
      - const: host-version-slot-int
      - const: pwr-pad-ctl
      - const: cmd-mux
      - const: cmd-pad
      - const: d0-mux
      - const: d0-pad
      - const: clk-mux
      - const: clk-pad
      - const: d3-mux
      - const: d3-pad
      - const: d2-mux
      - const: d2-pad
      - const: d1-mux
      - const: d1-pad
      - const: adi-controller
      - const: analog-slave
      - const: host-control2
      - const: card-detect-data
      - const: card-detect-mask

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    mmc@20300000 {
        compatible = "fplinux,ta1618-mmc";
        reg = <0x20e00000 0x4>, <0x20e01000 0x4>, <0x20e02000 0x4>,
              <0x20e00004 0x4>, <0x20e01004 0x4>, <0x20e02004 0x4>,
              <0x2150006c 0x4>, <0x20300000 0x4>, <0x20300004 0x4>,
              <0x20300024 0x4>, <0x20300028 0x4>, <0x2030002c 0x4>,
              <0x20300008 0x4>, <0x2030000c 0x4>, <0x20300010 0x4>,
              <0x20300014 0x4>, <0x20300018 0x4>, <0x2030001c 0x4>,
              <0x20300030 0x4>, <0x20300034 0x4>, <0x20300038 0x4>,
              <0x20300054 0x4>, <0x20300058 0x4>, <0x2030005c 0x4>,
              <0x203000fc 0x4>, <0x402a0000 0x4>, <0x402a0128 0x4>,
              <0x402a0528 0x4>, <0x402a012c 0x4>, <0x402a052c 0x4>,
              <0x402a0134 0x4>, <0x402a0534 0x4>, <0x402a0120 0x4>,
              <0x402a0520 0x4>, <0x402a0124 0x4>, <0x402a0524 0x4>,
              <0x402a0130 0x4>, <0x402a0530 0x4>, <0x40600000 0x400>,
              <0x40608000 0x1000>, <0x2030003c 0x4>, <0x402c0000 0x4>,
              <0x402c0004 0x4>;
        reg-names = "gate-state", "gate-set", "gate-clear", "ap-reset-state", "ap-reset-set", "ap-reset-clear", "ap-clock-selector", "block-count", "block-size", "present-state", "host-control1", "clock-timeout-reset", "argument", "transfer-command", "response0", "response1", "response2", "response3", "interrupt-status", "interrupt-status-enable", "interrupt-signal-enable", "adma-error", "adma2-address-low", "adma2-address-high", "host-version-slot-int", "pwr-pad-ctl", "cmd-mux", "cmd-pad", "d0-mux", "d0-pad", "clk-mux", "clk-pad", "d3-mux", "d3-pad", "d2-mux", "d2-pad", "d1-mux", "d1-pad", "adi-controller", "analog-slave", "host-control2", "card-detect-data", "card-detect-mask";
        interrupts = <GIC_SPI 57 IRQ_TYPE_LEVEL_HIGH>;
    };
