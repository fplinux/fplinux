%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/fplinux,ta1618-sc2720-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nokia TA-1618 SC2720 charger status

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Read-only observation of the SC2720 charger-present status on the Nokia
  3210 4G TA-1618. The driver provides no charger-control interface.

properties:
  compatible:
    const: fplinux,ta1618-sc2720-charger

required:
  - compatible

additionalProperties: false

examples:
  - |
    charger {
        compatible = "fplinux,ta1618-sc2720-charger";
    };
