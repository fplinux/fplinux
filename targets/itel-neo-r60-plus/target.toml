# SPDX-License-Identifier: GPL-2.0-only
platform = "ums9117"

[identity]
brand = "itel"
product = "Neo R60+"
hardware_codes = ["IT9310"]
compatible = "itel,neo-r60"

[nand]
raw_device = "/dev/ums9117-nand-raw"
id = 0x81c8
raw_page_bytes = 2176
ecc_format = "ums9117-bch12"

[display]
panel = "display/panel.toml"
boot_font = "7x14"

[display_brightness]
backlight = "itel-neo-r60-plus-backlight"
levels = [0, 5, 9, 14, 18, 23, 27, 32, 36, 41, 45]

[rootfs]
packages = [
  "fplinux-font-terminus-8x16",
  "fplinux-hostapd",
  "fplinux-libnl",
  "fplinux-wifi",
  "fplinux-wpa-supplicant",
]

[bundle]
packages = []

[linux]
memory = { base = 0x80200000, size = 0x03c00000 }
dtb = "unisoc/ums9117-itel-neo-r60-plus.dtb"
debug_dtb = "ums9117-itel-neo-r60-plus.dtb"
patches = []
additional_forbidden_dtb_markers = []
additional_forbidden_config = []
overlay = "linux/overlay"
copies = []

[[linux.appends]]
source = "linux/fragments/arch/arm/mach-ums9117/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "linux/fragments/dts/unisoc.Makefile"
destination = "arch/arm/boot/dts/unisoc/Makefile"

[[linux.appends]]
source = "linux/fragments/drivers/gpu/drm/ums9117/drm.Kconfig"
destination = "drivers/gpu/drm/Kconfig"

[[linux.appends]]
source = "linux/fragments/drivers/gpu/drm/ums9117/drm.Makefile"
destination = "drivers/gpu/drm/ums9117/Makefile"

[[linux.dt_config_checks]]
path = "/radio"
compatible = "fplinux,itel-neo-r60-marlin2"
config = "CONFIG_MMC_SDHCI_UMS9117_BQ_RADIO"

[[linux.dt_config_checks]]
path = "/radio"
compatible = "fplinux,itel-neo-r60-marlin2"
property = "mac-address-name"
config = "CONFIG_BQ2830L_WLAN"

[[linux.dt_config_checks]]
path = "/radio"
compatible = "fplinux,itel-neo-r60-marlin2"
property = "bluetooth-config-name"
config = "CONFIG_BQ2830L_BLUETOOTH"

[bootstrap]
lcd_config = "bootstrap/lcd_config.h"
image = "itel_neo_r60_plus_linux_bootstrap.bin"
map = "obj/itel_neo_r60_plus_linux_bootstrap_map.txt"
dtb_destination = "itel_neo_r60_plus.dtb"
record_prefix = "ITEL_NEO_R60_PLUS"

[adapter]
exec_distance = 0
session_name = "itel-neo-r60-plus-linux"
boot_instructions = "Power the phone off, hold the left soft key and call key together, then connect USB while keeping both keys pressed."

[device_data]
parser = "device-data/itel_device_data.py"

[audio_profile]
firmware = [
  { source = "itel-neo-r60-plus-audio-profile.bin", destination = "fplinux/itel-neo-r60-plus-audio-profile.bin", size = 788 },
]

[wcn_firmware]
firmware = [
  { source = "itel-neo-r60-plus-wcn.bin", destination = "ums9117/itel-neo-r60-plus-wcn.bin", size = 592896, sha256 = "453f52e204aa1211c99ef81ec665340cffff917a0da7ea84f46a18f6d8b0261e" },
  { source = "itel-neo-r60-plus-wcn-calibration.bin", destination = "ums9117/itel-neo-r60-plus-wcn-calibration.bin", size = 3908 },
  { source = "itel-neo-r60-plus-wcn-mac.bin", destination = "ums9117/itel-neo-r60-plus-wcn-mac.bin", size = 6 },
  { source = "itel-neo-r60-plus-wcn-bluetooth.bin", destination = "ums9117/itel-neo-r60-plus-wcn-bluetooth.bin", size = 220 },
]

[microsd.bootstrap]
image = "itel_neo_r60_plus_sd_stage0.bin"
map = "obj/itel_neo_r60_plus_sd_stage0_map.txt"
