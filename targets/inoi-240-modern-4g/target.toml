# SPDX-License-Identifier: GPL-2.0-only
name = "inoi-240-modern-4g"
display_name = "INOI 240 Modern 4G"
release_slug = "FPLinux-INOI-240-Modern-4G"
platform = "ums9117"

[bundle]
packages = []

[linux]
dtb = "unisoc/ums9117-inoi-240-modern-4g.dtb"
debug_dtb = "ums9117-inoi-240-modern-4g.dtb"
patches = [
  "kernel/0001-inoi-240-modern-4g-dtb.patch",
  "kernel/0002-inoi-240-modern-4g-dt-binding.patch",
]
forbidden_dtb_markers = ["sdhci", "mmc", "nand", "mtd", "ubi", "emmc"]
forbidden_config = [
  "CONFIG_MTD=y",
  "CONFIG_UBI=y",
  "CONFIG_SCSI=y",
  "CONFIG_ATA=y",
  "CONFIG_NVME_CORE=y",
  "CONFIG_DEVMEM=y",
  "CONFIG_MMC=y",
]

[[linux.copies]]
source = "dts/ums9117-inoi-240-modern-4g.dts"
destination = "arch/arm/boot/dts/unisoc/ums9117-inoi-240-modern-4g.dts"

[[linux.copies]]
source = "kernel/inoi240-fb.c"
destination = "drivers/video/fbdev/inoi240-fb.c"

[[linux.appends]]
source = "kernel/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "kernel/fbdev.Kconfig"
destination = "drivers/video/fbdev/Kconfig"

[[linux.appends]]
source = "kernel/fbdev.Makefile"
destination = "drivers/video/fbdev/Makefile"

[bootstrap]
image = "inoi240_linux_bootstrap.bin"
map = "obj/inoi240_linux_bootstrap_map.txt"
dtb_destination = "inoi240.dtb"

[adapter]
spi_mode = 3
lcd_id = 0x333025
exec_distance = 0
backlight_channels = "rgb"
backlight_level = 0x1f
session_name = "inoi240-linux"
handoff_marker = "INOI240_LINUX_BOOTSTRAP stage=5 message=PREPARE LINUX"
boot_instructions = "Power the phone off, hold *, then connect USB while keeping * pressed."
