# SPDX-License-Identifier: GPL-2.0-only
platform = "ums9117"

[identity]
brand = "INOI"
product = "240 Modern 4G"
hardware_codes = []
compatible = "inoi,240-modern-4g"

[nand]
raw_device = "/dev/ums9117-nand-raw"
id = 0x21e5
raw_page_bytes = 2112

[rootfs]
packages = ["fplinux-audio"]

[bundle]
packages = []

[linux]
config_fragment = "linux/config.fragment"
memory = { base = 0x80200000, size = 0x03c00000 }
dtb = "unisoc/ums9117-inoi-240-modern-4g.dtb"
debug_dtb = "ums9117-inoi-240-modern-4g.dtb"
patches = ["linux/patches/0001-inoi-240-modern-4g-dtb.patch"]
forbidden_dtb_markers = ["spi-nand", "mtd", "ubi", "emmc"]
forbidden_config = [
  "CONFIG_MTD=y",
  "CONFIG_UBI=y",
  "CONFIG_SCSI=y",
  "CONFIG_ATA=y",
  "CONFIG_NVME_CORE=y",
  "CONFIG_DEVMEM=y",
]

[[linux.copies]]
source = "linux/dts/ums9117-inoi-240-modern-4g.dts"
destination = "arch/arm/boot/dts/unisoc/ums9117-inoi-240-modern-4g.dts"

[[linux.copies]]
source = "linux/dts/nand-readonly.dtsi"
destination = "arch/arm/boot/dts/unisoc/inoi-240-modern-4g-nand-readonly.dtsi"

[[linux.copies]]
source = "linux/dts/bluetooth.dtsi"
destination = "arch/arm/boot/dts/unisoc/inoi-240-modern-4g-bluetooth.dtsi"

[[linux.copies]]
source = "linux/drivers/video/fbdev/inoi240-fb.c"
destination = "drivers/video/fbdev/inoi240-fb.c"

[[linux.appends]]
source = "linux/arch/arm/mach-ums9117/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.appends]]
source = "linux/drivers/video/fbdev/fbdev.Kconfig"
destination = "drivers/video/fbdev/Kconfig"

[[linux.appends]]
source = "linux/drivers/video/fbdev/fbdev.Makefile"
destination = "drivers/video/fbdev/Makefile"

[bootstrap]
image = "inoi240_linux_bootstrap.bin"
map = "obj/inoi240_linux_bootstrap_map.txt"
dtb_destination = "inoi240.dtb"
record_prefix = "INOI240"

[adapter]
spi_mode = 3
lcd_id = 0x333025
exec_distance = 0
backlight_channels = "rgb"
backlight_level = 0x1f
session_name = "inoi240-linux"
boot_instructions = "Power the phone off, hold *, then connect USB while keeping * pressed."

[device_data]
parser = "inoi240_device_data.py"

[bluetooth]
firmware = [
  { source = "inoi240-cm4.bin", destination = "ums9117/inoi240-cm4.bin", size = 463296, sha256 = "ffe5e4cb568552601281a0026bc1f9f5715f1715b1261062c23669e95b5e086d" },
  { source = "inoi240-bt-config.bin", destination = "ums9117/inoi240-bt-config.bin", size = 8 },
  { source = "inoi240-bt-sprd.bin", destination = "ums9117/inoi240-bt-sprd.bin", size = 176 },
  { source = "inoi240-bt-rf-config.bin", destination = "ums9117/inoi240-bt-rf-config.bin", size = 252 },
]

[audio_profile]
firmware = [
  { source = "inoi240-audio-profile.bin", destination = "fplinux/inoi240-audio-profile.bin", size = 43 },
]

[microsd]
linux_patches = []

[microsd.bootstrap]
source = "bootstrap-microsd"
image = "inoi240_sd_stage0.bin"
map = "obj/inoi240_sd_stage0_map.txt"

[microsd.uboot]
defconfig = "uboot/inoi240_defconfig"
patches = []

[[microsd.uboot.copies]]
source = "targets/inoi-240-modern-4g/uboot/ums9117-inoi240-u-boot.dts"
destination = "arch/arm/dts/ums9117-inoi240-u-boot.dts"
