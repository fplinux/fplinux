# SPDX-License-Identifier: GPL-2.0-only
name = "default"

[linux.root]
kind = "initramfs"

[rootfs]
packages = ["fplinux-soundfont-lite"]
applications = [
  "fplinux-calculator",
  "fplinux-clocks",
  "fplinux-example-apidemo",
  "fplinux-files",
  "fplinux-music",
  "fplinux-notes",
  "fplinux-showcase",
  "fplinux-snake",
  "fplinux-terminal",
]

[bootstrap]
kind = "linux"

[uboot]
kind = "none"

[fit]
kind = "none"

[runtime]
transport = "usb-ncm"
runnable = true
