<text x="360" y="136" class="dg-text-strong" fill="#202D35" font-size="14" font-weight="700" text-anchor="middle">Boot ROM mode</text>
<text x="360" y="152" class="dg-text-small" fill="#202D35" font-size="12" text-anchor="middle">USB device</text>
<text x="360" y="168" class="dg-text-small dg-mono" fill="#202D35" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">1782:4d00</text>
<rect x="548" y="12" width="168" height="172" rx="10" class="dg-box-primary" fill="#D3E5ED" stroke="#396475" stroke-width="1.5"/>
