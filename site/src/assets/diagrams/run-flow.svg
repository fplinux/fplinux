<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 224" role="img" aria-labelledby="run-flow-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif">
<title id="run-flow-title">Running FPLinux: from the PC to a shell on the phone</title>
<defs><marker id="run-flow-arrow" viewBox="0 0 8 8" refX="2" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="dg-arrow-head" fill="#396475"/></marker></defs>
<rect x="4" y="12" width="168" height="172" rx="10" class="dg-box" fill="#FFFFFF" stroke="#6E797D" stroke-width="1.5"/>
<g transform="translate(52,38)"><rect x="0" y="0" width="72" height="48" rx="4" class="dg-box" fill="#FFFFFF" stroke="#6E797D" stroke-width="1.5"/><rect x="5" y="5" width="62" height="36" rx="2" class="dg-box-primary" fill="#D3E5ED" stroke="#396475" stroke-width="1.5"/><path d="M36,48 L36,60" class="dg-line" fill="none" stroke="#202D35" stroke-width="1.5"/><rect x="20" y="60" width="32" height="4" rx="1" class="dg-fill-muted" fill="#6E797D"/></g>
