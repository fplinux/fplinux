%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/sprd,ums9117-sc2720-auxadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC2720 AUXADC on UMS9117

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Direct raw readings from the SC2720 AUXADC through the UMS9117 analog-die
  interface. Channel numbers identify ADC inputs without assigning board
  signal names or converting values to physical units.

properties:
  compatible:
    const: sprd,ums9117-sc2720-auxadc

required:
  - compatible

additionalProperties: false

examples:
  - |
    auxadc {
        compatible = "sprd,ums9117-sc2720-auxadc";
    };
