%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fplinux,ums9117-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FPLinux UMS9117 headphone audio device

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  24 kHz and 48 kHz stereo S16_LE ALSA PCM device using the UMS9117 AUD and
  VBC register blocks and the SC2720 headphone output. Enabled boards provide
  their fitted audio-pad expectations in SCLK, DASYNC, DAD0 and DAD1 order.

properties:
  compatible:
    const: fplinux,ums9117-audio

  reg:
    items:
      - description: AUD register block
      - description: VBC register block
      - description: Inherited audio clock registers
      - description: Audio pin mux registers
      - description: Audio pin configuration registers

  reg-names:
    items:
      - const: aud
      - const: vbc
      - const: clk1
      - const: pinmux
      - const: pinconf

  fplinux,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Always-on APB syscon used by the audio device.

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Optional fitted headphone profile. The profile's machine identity must
      match the first compatible string of the root Devicetree node.

  fplinux,card-longname:
    $ref: /schemas/types.yaml#/definitions/string
    description: ALSA card long name for the fitted phone.

  fplinux,idle-silence:
    type: boolean
    description: |
      Start the headphone path at 48 kHz with zero PCM and keep it
      active between playback streams. While enabled, the PCM hardware rate is
      fixed at 48 kHz so application-side conversion does not require an
      audible hardware rate transition.

  fplinux,pad-settings:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 12
    maxItems: 12
    description: |
      Four board-owned triples containing register offset, mux value and pad
      configuration for SCLK, DASYNC, DAD0 and DAD1, in that order.

required:
  - compatible
  - reg
  - reg-names
  - fplinux,aon-apb

allOf:
  - if:
      properties:
        status:
          const: okay
      required:
        - status
    then:
      required:
        - fplinux,pad-settings
        - fplinux,card-longname

additionalProperties: false

examples:
  - |
    audio@40000000 {
        compatible = "fplinux,ums9117-audio";
        reg = <0x40000000 0x1000>, <0x40020000 0x2000>,
              <0x402d0258 0x18>, <0x402a00f0 0x20>,
              <0x402a04f0 0x20>;
        reg-names = "aud", "vbc", "clk1", "pinmux", "pinconf";
        fplinux,aon-apb = <&aon_apb>;
        fplinux,pad-settings = <
            0x00 0 0x0008e001
            0x08 0 0x0008e001
            0x0c 0 0x0008e001
            0x1c 0 0x0008e001
        >;
        fplinux,card-longname = "Nokia TA-1618 headphone output";
        status = "okay";
    };
