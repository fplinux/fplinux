# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/sprd,ums9117-sc2720-fgu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC2720 fuel gauge on UMS9117

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Read-only battery voltage, current and relative charge counter reporting
  through the SC2720 fuel gauge connected to the UMS9117 analog-die interface.

properties:
  compatible:
    const: sprd,ums9117-sc2720-fgu

  fplinux,current-calibration:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: |
      Board current-calibration resistance ratio, real then reference value
      in the same units. The current scale is the voltage scale multiplied
      by four and by this ratio, rounded to the nearest integer.
    items:
      - minimum: 1
        description: Real calibration resistance
      - minimum: 1
        description: Reference calibration resistance

required:
  - compatible
  - fplinux,current-calibration

additionalProperties: false

examples:
  - |
    fuel-gauge {
        compatible = "sprd,ums9117-sc2720-fgu";
        fplinux,current-calibration = <10 20>;
    };
