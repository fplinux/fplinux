# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/sprd,ums9117-sc2720-eic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 SC2720 analog EIC controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  The SC2720 debounced external-interrupt controller is reached through the
  UMS9117 ADI transport. The transport has one platform-wide owner, so this
  node deliberately has no reg property. During Linux runtime this controller
  consumes the EICA child source supplied by the SC2720 analog interrupt
  aggregate controller.

properties:
  compatible:
    const: sprd,ums9117-sc2720-eic

  interrupts:
    maxItems: 1
    description: SC2720 INTA source 4, the EICA aggregate.

  gpio-controller: true

  '#gpio-cells':
    const: 2

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

required:
  - compatible
  - interrupts
  - gpio-controller
  - '#gpio-cells'
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    analog-eic {
        compatible = "sprd,ums9117-sc2720-eic";
        gpio-controller;
        #gpio-cells = <2>;
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupt-parent = <&sc2720_inta>;
        interrupts = <4 IRQ_TYPE_LEVEL_HIGH>;
    };
...
