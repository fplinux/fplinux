%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/fplinux,ums9117-aon-apb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 always-on APB register block

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  System controller of the UMS9117 always-on APB bank. It owns the
  enable gates of inherited peripherals such as the keypad block and is
  accessed as a syscon regmap.

properties:
  compatible:
    items:
      - const: fplinux,ums9117-aon-apb
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@402e0000 {
        compatible = "fplinux,ums9117-aon-apb", "syscon";
        reg = <0x402e0000 0x3000>;
    };
