%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/fplinux,ums9117-syscounter.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 free-running AP system counter

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Free-running 1 ms system counter in the UMS9117 AP always-on block.
  RAM-booted systems use it as clocksource and sched_clock. The counter
  has no interrupt and no programmable clock inputs.

properties:
  compatible:
    const: fplinux,ums9117-syscounter

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscounter@40230000 {
        compatible = "fplinux,ums9117-syscounter";
        reg = <0x40230000 0x10>;
    };
