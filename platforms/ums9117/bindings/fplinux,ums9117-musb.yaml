# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/fplinux,ums9117-musb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 MUSB controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  UMS9117 has a MUSB HDRC-compatible dual-role core. The inherited profile
  adopts the controller state supplied by the RAM-loading path. The cold-owned
  profile reconstructs the controller's clocks, resets, PHY configuration and
  USB 3.3 V supply before registering the same peripheral-only MUSB core.

properties:
  compatible:
    enum:
      - fplinux,ums9117-musb-inherited
      - fplinux,ums9117-musb

  reg:
    minItems: 1
    maxItems: 4

  reg-names:
    items:
      - const: musb
      - const: ap-ahb
      - const: anlg-phy-g8
      - const: anlg-phy-top

  interrupts:
    maxItems: 1

  dr_mode:
    const: peripheral

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Always-on APB syscon used for the USB PHY gate and power state.

  vddusb-supply:
    description: Phandle to the target's USB 3.3 V regulator.

required:
  - compatible
  - reg
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          const: fplinux,ums9117-musb
      required:
        - compatible
    then:
      properties:
        reg:
          minItems: 4
          maxItems: 4
        reg-names:
          minItems: 4
          maxItems: 4
      required:
        - reg-names
        - sprd,aon-apb
        - vddusb-supply
    else:
      properties:
        reg:
          maxItems: 1
        reg-names: false
        sprd,aon-apb: false
        vddusb-supply: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    usb@20200000 {
        compatible = "fplinux,ums9117-musb-inherited";
        reg = <0x20200000 0x2000>;
        interrupts = <GIC_SPI 55 IRQ_TYPE_LEVEL_HIGH>;
        dr_mode = "peripheral";
    };

  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    usb@20200000 {
        compatible = "fplinux,ums9117-musb";
        reg = <0x20200000 0x2000>,
              <0x20e00000 0x4000>,
              <0x40430000 0x3000>,
              <0x403e0000 0x3000>;
        reg-names = "musb", "ap-ahb", "anlg-phy-g8", "anlg-phy-top";
        interrupts = <GIC_SPI 55 IRQ_TYPE_LEVEL_HIGH>;
        dr_mode = "peripheral";
        sprd,aon-apb = <&aon_apb>;
        vddusb-supply = <&vddusb>;
    };
