# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/media/sprd,ums9117-rota.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 image rotation engine

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  ROTA relocates byte, half-word, and word image samples for clockwise
  rotation or horizontal mirroring. It generates an external linked-list
  descriptor in its own register aperture and completes through the UMS9117
  AP DMA controller's dedicated ROTA request route and LISTDONE interrupt.
  It therefore has no interrupt of its own.

properties:
  compatible:
    const: sprd,ums9117-rota

  reg:
    items:
      - description: ROTA registers and hardware-generated DMA list
      - description: Shared AP AHB clock-enable state
      - description: Shared AP AHB clock-enable SET alias
      - description: Shared AP AHB clock-enable CLEAR alias
      - description: Shared AP AHB reset SET alias
      - description: Shared AP AHB reset CLEAR alias

  reg-names:
    items:
      - const: rota
      - const: ap-ahb-gate-state
      - const: ap-ahb-gate-set
      - const: ap-ahb-gate-clear
      - const: ap-ahb-reset-set
      - const: ap-ahb-reset-clear

  memory-region:
    maxItems: 1
    description: Reusable DMA pool shared by the frame-moving engines.

required:
  - compatible
  - reg
  - reg-names
  - memory-region

additionalProperties: false

examples:
  - |
    rota@20900000 {
        compatible = "sprd,ums9117-rota";
        reg = <0x20900000 0x450>,
              <0x20e00000 0x4>,
              <0x20e01000 0x4>,
              <0x20e02000 0x4>,
              <0x20e01004 0x4>,
              <0x20e02004 0x4>;
        reg-names = "rota", "ap-ahb-gate-state", "ap-ahb-gate-set",
                    "ap-ahb-gate-clear", "ap-ahb-reset-set",
                    "ap-ahb-reset-clear";
        memory-region = <&codec_dma>;
    };
