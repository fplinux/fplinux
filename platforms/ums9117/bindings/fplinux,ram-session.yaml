%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/fplinux,ram-session.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FPLinux RAM-boot session data

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  The FPLinux RAM loader supplies per-boot host identity and USB configuration
  to the bootstrap in a fixed session record. Before handing control to Linux,
  the bootstrap validates that record and replaces the marker values in this
  node. Consumers must treat the properties as opaque fixed-size byte arrays.

properties:
  $nodename:
    const: fplinux-session

  compatible:
    const: fplinux,ram-session

  fplinux,ssh-client-key:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 68
    maxItems: 68
    description: Base64-encoded SSH Ed25519 public-key blob for this RAM run.

  fplinux,session-id:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 32
    maxItems: 32
    description: Random identifier unique to this RAM run.

  fplinux,usb-session:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 256
    maxItems: 256
    description: NUL-padded USB session configuration for this RAM run.

required:
  - compatible
  - fplinux,ssh-client-key
  - fplinux,session-id
  - fplinux,usb-session

additionalProperties: false

examples:
  - |
    / {
        fplinux-session {
            compatible = "fplinux,ram-session";
            fplinux,ssh-client-key = [
                b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2
                b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2 b2
