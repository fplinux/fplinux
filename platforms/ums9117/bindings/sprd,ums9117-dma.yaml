%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/sprd,ums9117-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 AP DMA controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  The AP controller has 32 full channels with a shared completion interrupt.
  Software-requested memory copies use 32-bit addresses. The AP AHB clock
  enable word and its atomic SET/CLEAR aliases are shared with other devices;
  this controller owns only bit 5 and does not change the other bits.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    const: sprd,ums9117-dma

  reg:
    items:
      - description: AP DMA controller registers
      - description: Shared AP AHB clock enable state
      - description: Shared AP AHB clock enable SET alias
      - description: Shared AP AHB clock enable CLEAR alias

  reg-names:
    items:
      - const: dma
      - const: ap-ahb-state
      - const: ap-ahb-set
      - const: ap-ahb-clear

  interrupts:
    maxItems: 1

  "#dma-cells":
    const: 1
    description: Peripheral DMA request number.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - "#dma-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    dma-controller@20100000 {
        compatible = "sprd,ums9117-dma";
        reg = <0x20100000 0x2100>,
              <0x20e00000 0x4>,
              <0x20e01000 0x4>,
              <0x20e02000 0x4>;
        reg-names = "dma", "ap-ahb-state", "ap-ahb-set", "ap-ahb-clear";
        interrupts = <GIC_SPI 50 IRQ_TYPE_LEVEL_HIGH>;
        #dma-cells = <1>;
    };
