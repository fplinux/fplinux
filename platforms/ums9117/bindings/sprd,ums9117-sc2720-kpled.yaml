%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/sprd,ums9117-sc2720-kpled.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC2720 keypad backlight on UMS9117

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  LED class device for the keypad current-sink output in the SC2720
  analog die. This child of the SC2720 PMIC uses its register map and owns
  only the current and power-down fields in KPLED_CTRL0.

allOf:
  - $ref: /schemas/leds/common.yaml#

properties:
  compatible:
    const: sprd,ums9117-sc2720-kpled

  reg:
    maxItems: 1

  function:
    const: kbd_backlight

  linux,default-trigger:
    const: input-events

  fplinux,current-code:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 15
    description: SC2720 KPLED current code selected for the fitted LEDs

required:
  - compatible
  - reg
  - function
  - linux,default-trigger
  - fplinux,current-code

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        keypad-backlight@df8 {
            compatible = "sprd,ums9117-sc2720-kpled";
            reg = <0xdf8>;
            function = LED_FUNCTION_KBD_BACKLIGHT;
            linux,default-trigger = "input-events";
            fplinux,current-code = <1>;
        };
    };
