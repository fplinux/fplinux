%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/sprd,ums9117-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 reset controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Reset controller for the UMS9117 application AHB register bank. Reset lines
  use separate write-one SET and CLEAR aliases instead of read-modify-write.

properties:
  compatible:
    const: sprd,ums9117-apahb-reset

  sprd,syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the application AHB syscon.

  '#reset-cells':
    const: 1

required:
  - compatible
  - sprd,syscon
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    ap_ahb: syscon@20e00000 {
        compatible = "sprd,ums9117-ap-ahb", "syscon";
        reg = <0x20e00000 0x3000>;
    };

    reset-controller {
        compatible = "sprd,ums9117-apahb-reset";
        sprd,syscon = <&ap_ahb>;
        #reset-cells = <1>;
    };
