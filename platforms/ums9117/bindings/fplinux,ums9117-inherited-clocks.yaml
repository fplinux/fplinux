# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/fplinux,ums9117-inherited-clocks.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 inherited clock observer

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Read-only observation of the MPLL and current Cortex-A7 core clock state left
  active by the UMS9117 boot firmware. The provider does not control clock
  parents, dividers, PLLs or gates.

properties:
  compatible:
    const: fplinux,ums9117-inherited-clocks

  reg:
    items:
      - description: Cortex-A7 core clock divider register
      - description: Cortex-A7 core clock source register
      - description: MPLL control registers 0 through 2

  reg-names:
    items:
      - const: ca7-divider
      - const: ca7-source
      - const: mpll

  '#clock-cells':
    const: 1
    description:
      Clock index defined in
      dt-bindings/clock/fplinux,ums9117-inherited-clk.h.

required:
  - compatible
  - reg
  - reg-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@20e00038 {
        compatible = "fplinux,ums9117-inherited-clocks";
        reg = <0x20e00038 0x4>, <0x20e00054 0x4>,
              <0x403f0000 0xc>;
        reg-names = "ca7-divider", "ca7-source", "mpll";
        #clock-cells = <1>;
    };
