# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/sprd,ums9117-sc2720-inta.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 SC2720 analog interrupt aggregate

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  SC2720 analog interrupt sources share one UMS9117 GIC interrupt and are
  reached through the platform-wide ADI transport. The controller provides
  only source 1 for the RTC alarm and source 4 for the analog EIC. Other
  hardware sources are deliberately not exposed.

properties:
  compatible:
    const: sprd,ums9117-sc2720-inta

  interrupts:
    maxItems: 1
    description: UMS9117 GIC SPI38, the SC2720 analog interrupt aggregate.

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

required:
  - compatible
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    sc2720-inta {
        compatible = "sprd,ums9117-sc2720-inta";
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupt-parent = <&gic>;
        interrupts = <GIC_SPI 38 IRQ_TYPE_LEVEL_HIGH>;
    };
...
