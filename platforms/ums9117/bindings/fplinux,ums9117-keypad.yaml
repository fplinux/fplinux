%YAML 1.2
---
$id: http://devicetree.org/schemas/input/fplinux,ums9117-keypad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 polled matrix keypad

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Matrix keypad controller found in UMS9117 feature phones. The controller and
  inherited analog EIC state are polled because their interrupt routes are not
  hardware-qualified. The driver only reads the inherited EIC data register;
  it does not configure the EIC controller.

allOf:
  - $ref: matrix-keymap.yaml#

properties:
  compatible:
    const: fplinux,ums9117-keypad

  reg:
    maxItems: 1

  label:
    $ref: /schemas/types.yaml#/definitions/string
    description: Stable input device name.

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon that gates and resets the keypad controller.

  sprd,eic-data-address:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Inherited analog EIC data register, read through shared ADI.

  sprd,eic9-keycode:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 9
    description: Optional EIC9 key. UMS9117 phones use Linux KEY_8 (9).

required:
  - compatible
  - reg
  - label
  - keypad,num-rows
  - keypad,num-columns
  - linux,keymap
  - sprd,aon-apb
  - sprd,eic-data-address

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/input/input.h>

    keypad@40250000 {
        compatible = "fplinux,ums9117-keypad";
        reg = <0x40250000 0x100>;
        label = "UMS9117 keypad";
        keypad,num-rows = <5>;
        keypad,num-columns = <4>;
        linux,keymap = <
            MATRIX_KEY(0, 0, KEY_KPASTERISK)
            MATRIX_KEY(0, 1, KEY_0)
            MATRIX_KEY(0, 2, KEY_KPDOT)
            MATRIX_KEY(0, 3, KEY_ENTER)
        >;
        sprd,aon-apb = <&aon_apb>;
        sprd,eic-data-address = <0x40608280>;
    };
