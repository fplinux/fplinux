%YAML 1.2
---
$id: http://devicetree.org/schemas/input/fplinux,ums9117-keypad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 matrix keypad

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Matrix keypad controller found in UMS9117 feature phones. The matrix may use
  an optional direct controller interrupt described by the board; otherwise it
  is polled. Target-owned analog EIC keys may be supplied as GPIO inputs by a
  separate SC2720 EIC provider.

allOf:
  - $ref: matrix-keymap.yaml#

properties:
  compatible:
    const: fplinux,ums9117-keypad

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Optional direct matrix controller interrupt.

  interrupt-names:
    const: matrix

  label:
    $ref: /schemas/types.yaml#/definitions/string
    description: Stable input device name.

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon that gates and resets the keypad controller.

  wakeup-source:
    description: The target-owned EIC1 power key can wake system sleep.
    type: boolean

  eic1-gpios:
    maxItems: 1
    description: Optional target-owned SC2720 EIC1 input.

  sprd,eic1-keycode:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 767
    description: Target-owned keycode for eic1-gpios.

  eic9-gpios:
    maxItems: 1
    description: Optional target-owned SC2720 EIC9 input.

  sprd,eic9-keycode:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 767
    description: Target-owned keycode for eic9-gpios.

required:
  - compatible
  - reg
  - label
  - keypad,num-rows
  - keypad,num-columns
  - linux,keymap
  - sprd,aon-apb
dependencies:
  interrupts: [interrupt-names]
  interrupt-names: [interrupts]
  eic1-gpios: ["sprd,eic1-keycode"]
  "sprd,eic1-keycode": [eic1-gpios]
  wakeup-source: [eic1-gpios]
  eic9-gpios: ["sprd,eic9-keycode"]
  "sprd,eic9-keycode": [eic9-gpios]

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/input/input.h>

    keypad@40250000 {
        compatible = "fplinux,ums9117-keypad";
        reg = <0x40250000 0x100>;
        label = "UMS9117 keypad";
        keypad,num-rows = <5>;
        keypad,num-columns = <4>;
        linux,keymap = <
            MATRIX_KEY(0, 0, KEY_KPASTERISK)
            MATRIX_KEY(0, 1, KEY_0)
            MATRIX_KEY(0, 2, KEY_KPDOT)
            MATRIX_KEY(0, 3, KEY_ENTER)
        >;
        sprd,aon-apb = <&aon_apb>;
    };
