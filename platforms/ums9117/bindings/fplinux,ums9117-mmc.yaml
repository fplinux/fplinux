%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/fplinux,ums9117-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 SDIO0 removable microSD host

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  The removable microSD slot uses UMS9117 SDIO0 and an active-low EIC input.
  Its host-control register at offset 0x28 requires 32-bit access; the
  controller has no SDHCI power-control byte. The internal NAND is on a
  separate controller and is not reachable through this node.

  Register windows cover the AP AHB gates and reset, clock selection, SDIO0,
  bus pins, ADI and card detection. Each window must match the platform's
  address and size. Card-detect DATA and DMSK are EIC2 bit0; no GPIO output
  is part of this interface.

properties:
  compatible:
    const: fplinux,ums9117-mmc

  reg:
    minItems: 43
    maxItems: 43

  reg-names:
    items:
      - const: gate-state
      - const: gate-set
      - const: gate-clear
      - const: ap-reset-state
      - const: ap-reset-set
      - const: ap-reset-clear
      - const: ap-clock-selector
      - const: block-count
      - const: block-size
      - const: present-state
      - const: host-control1
      - const: clock-timeout-reset
      - const: argument
      - const: transfer-command
      - const: response0
      - const: response1
      - const: response2
      - const: response3
      - const: interrupt-status
      - const: interrupt-status-enable
      - const: interrupt-signal-enable
      - const: adma-error
      - const: adma2-address-low
      - const: adma2-address-high
      - const: host-version-slot-int
      - const: pwr-pad-ctl
      - const: cmd-mux
      - const: cmd-pad
      - const: d0-mux
      - const: d0-pad
      - const: clk-mux
      - const: clk-pad
      - const: d3-mux
      - const: d3-pad
      - const: d2-mux
      - const: d2-pad
      - const: d1-mux
      - const: d1-pad
      - const: adi-controller
      - const: analog-slave
      - const: host-control2
      - const: card-detect-data
      - const: card-detect-mask

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts

additionalProperties: false
