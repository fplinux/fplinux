# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/sprd,ums9117-sc2720-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC2720 real-time clock on UMS9117

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Time reporting, clock setting and normal one-shot alarms through the
  SC2720 RTC connected to the UMS9117 analog-die interface.

properties:
  compatible:
    const: sprd,ums9117-sc2720-rtc

  interrupts:
    maxItems: 1

  interrupt-names:
    const: alarm

  wakeup-source: true

required:
  - compatible
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    rtc {
        compatible = "sprd,ums9117-sc2720-rtc";
        interrupt-parent = <&sc2720_inta>;
        interrupts = <1 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "alarm";
    };
