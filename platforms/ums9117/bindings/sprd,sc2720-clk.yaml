%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,sc2720-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC2720 crystal output request

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  The SC2720 XTL_WAIT_CTRL0 register controls a shared 26 MHz request.
  The provider is a child of the SC2720 PMIC and uses its register map.

properties:
  compatible:
    const: sprd,sc2720-clk

  '#clock-cells':
    const: 0

required:
  - compatible
  - '#clock-cells'

additionalProperties: false
