# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/display/fplinux,ums9117-fb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: UMS9117 LCDC display with current-controlled backlight

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Enabled backlight channels use equal nonzero current codes. Brightness
  varies those codes, up to the declared current of an enabled channel.

allOf:
  - $ref: fplinux,ums9117-fb-common.yaml#
  - if:
      properties:
        compatible:
          enum:
            - fplinux,ums9117-nv3030-lcm-fb
            - fplinux,ums9117-nv3023-lcm-fb
            - fplinux,ums9117-gc9307-lcm-fb
    then:
      properties:
        reg-names:
          contains:
            const: lcm-data
    else:
      properties:
        reg-names:
          contains:
            const: spi

properties:
  compatible:
    enum:
      - fplinux,ums9117-st7789p3-spi-fb
      - fplinux,ums9117-st7789h2-spi-fb
      - fplinux,ums9117-gc9307-spi-fb
      - fplinux,ums9117-uniwa-v1000-spi-fb
      - fplinux,ums9117-nokia110-spi-fb
      - fplinux,ums9117-nv3030-lcm-fb
      - fplinux,ums9117-nv3023-lcm-fb
      - fplinux,ums9117-gc9307-lcm-fb

  sprd,wled-default-level:
    maximum: 63
    description: Initial backlight current code.

required:
  - compatible

unevaluatedProperties: false
