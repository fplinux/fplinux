%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fplinux,ums9117-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FPLinux UMS9117 audio device

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  24 kHz and 48 kHz stereo S16_LE ALSA PCM device using the UMS9117 AUD and
  VBC register blocks and the SC2720 codec. Enabled boards provide
  their fitted audio-pad expectations in SCLK, DASYNC, DAD0 and DAD1 order.
  Boards with a handset microphone on SC2720 MIC1 can also provide ADSYNC and
  ADD0 pad expectations to expose 48 kHz mono S16_LE capture. Playback and
  capture can run together at 48 kHz.

properties:
  compatible:
    const: fplinux,ums9117-audio

  reg:
    items:
      - description: AUD register block
      - description: VBC register block
      - description: Inherited audio clock registers
      - description: Audio pin mux registers
      - description: Audio pin configuration registers
      - description: IIS matrix routing register

  reg-names:
    items:
      - const: aud
      - const: vbc
      - const: clk1
      - const: pinmux
      - const: pinconf
      - const: iis-matrix

  fplinux,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Always-on APB syscon used by the audio device.

  sprd,pmic:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SC2720 PMIC containing the audio codec registers.

  clocks:
    maxItems: 1

  clock-names:
    const: xtal

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Optional fitted audio profile with headphone and speaker gains. The
      profile's machine identity must match the first compatible string of the
      root Devicetree node. Without it the speaker output is not exposed.

  fplinux,card-longname:
    $ref: /schemas/types.yaml#/definitions/string
    description: ALSA card long name for the fitted phone.

  fplinux,pad-settings:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 12
    maxItems: 12
    description: |
      Four board-owned triples containing register offset, mux value and pad
      configuration for SCLK, DASYNC, DAD0 and DAD1, in that order.

  fplinux,capture-pad-settings:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 6
    maxItems: 6
    description: |
      Two board-owned triples containing register offset, mux value and pad
      configuration for ADSYNC and ADD0, in that order. Their presence enables
      handset microphone capture; the driver verifies inherited pad settings.

required:
  - compatible
  - reg
  - reg-names
  - fplinux,aon-apb
  - sprd,pmic
  - clocks
  - clock-names

allOf:
  - if:
      properties:
        status:
          const: okay
      required:
        - status
    then:
      required:
        - fplinux,pad-settings
        - fplinux,card-longname

additionalProperties: false

examples:
  - |
    audio@40000000 {
        compatible = "fplinux,ums9117-audio";
        reg = <0x40000000 0x1000>, <0x40020000 0x2000>,
              <0x402d0258 0x18>, <0x402a00f0 0x20>,
              <0x402a04f0 0x20>, <0x402a0004 0x4>;
        reg-names = "aud", "vbc", "clk1", "pinmux", "pinconf",
                    "iis-matrix";
        fplinux,aon-apb = <&aon_apb>;
        sprd,pmic = <&sc2720_pmic>;
        clocks = <&sc2720_xtal>;
        clock-names = "xtal";
        fplinux,pad-settings = <
            0x00 0 0x0008e001
            0x08 0 0x0008e001
            0x0c 0 0x0008e001
            0x1c 0 0x0008e001
        >;
        fplinux,card-longname = "Nokia TA-1618 headphone output";
        status = "okay";
    };
