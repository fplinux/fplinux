%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fplinux,ums9117-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FPLinux UMS9117 audio device

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  24 kHz and 48 kHz stereo S16_LE ALSA PCM device using the UMS9117 AUD and
  VBC register blocks and the SC2720 codec. Enabled boards provide
  their fitted SCLK, DASYNC, DAD0 and DAD1 pins through an audio pinctrl state.
  Boards with a handset microphone on SC2720 MIC1 also configure ADSYNC and
  ADD0 and enable 48 kHz mono S16_LE capture. Playback and
  capture can run together at 48 kHz.

allOf:
  - if:
      properties:
        status:
          const: okay
      required:
        - status
    then:
      required:
        - pinctrl-names
        - pinctrl-0
        - fplinux,card-longname

properties:
  compatible:
    const: fplinux,ums9117-audio

  reg:
    items:
      - description: AUD register block
      - description: VBC register block
      - description: Audio clock selector registers
      - description: IIS matrix routing register

  reg-names:
    items:
      - const: aud
      - const: vbc
      - const: clk1
      - const: iis-matrix

  fplinux,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Always-on APB syscon used by the audio device.

  sprd,pmic:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SC2720 PMIC containing the audio codec registers.

  clocks:
    maxItems: 1

  clock-names:
    const: xtal

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Optional fitted audio profile with the headphone, speaker and combined
      headphone-and-speaker gains, the stock equalizer and ALC processing of
      each of these outputs, and the vibrate tone on boards with
      fplinux,speaker-vibration. The profile's machine identity must match
      the first compatible string of the root Devicetree node. Without it
      the speaker output is not exposed.

  fplinux,card-longname:
    $ref: /schemas/types.yaml#/definitions/string
    description: ALSA card long name for the fitted phone.

  pinctrl-names:
    items:
      - const: audio

  pinctrl-0: true

  fplinux,microphone-capture:
    type: boolean
    description: |
      The handset microphone is connected to SC2720 MIC1. Its ADSYNC and ADD0
      pins are included in the audio pinctrl state. Expose 48 kHz mono S16_LE
      capture; simultaneous playback uses 48 kHz.

  fplinux,speaker-vibration:
    type: boolean
    description: |
      The speaker also vibrates the phone, which has no separate vibration
      motor. Expose a force-feedback vibrator that plays the fitted vibrate
      tone through the speaker amplifier.

  hp-det-gpios:
    maxItems: 1
    description: |
      Board-owned headphone jack detect input. The GPIO flags give the level
      that means headphones are inserted. Its presence adds the Headphone Jack
      control and a headphone switch input device.

  wakeup-source:
    type: boolean
    description: A headphone jack change can wake system sleep.

required:
  - compatible
  - reg
  - reg-names
  - fplinux,aon-apb
  - sprd,pmic
  - clocks
  - clock-names

dependencies:
  wakeup-source: [hp-det-gpios]

additionalProperties: false

examples:
  - |
    audio@40000000 {
        compatible = "fplinux,ums9117-audio";
        reg = <0x40000000 0x1000>, <0x40020000 0x2000>,
              <0x402d0258 0x18>, <0x402a0004 0x4>;
        reg-names = "aud", "vbc", "clk1", "iis-matrix";
        fplinux,aon-apb = <&aon_apb>;
        sprd,pmic = <&sc2720_pmic>;
        clocks = <&sc2720_xtal>;
        clock-names = "xtal";
        pinctrl-names = "audio";
        pinctrl-0 = <&audio_mux_pins &audio_pad_pins>;
        fplinux,card-longname = "Nokia TA-1618 headphone output";
        status = "okay";
    };
