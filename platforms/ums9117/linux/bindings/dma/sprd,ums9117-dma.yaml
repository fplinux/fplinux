# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/sprd,ums9117-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 AP DMA controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  The AP DMA controller provides 32 channels. Request 0 selects
  software-triggered memory copies and request 1 is connected to ROTA.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    const: sprd,ums9117-dma

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: enable

  '#dma-cells':
    const: 1
    description: DMA request number, either 0 for memcpy or 1 for ROTA.

  dma-channels:
    const: 32

  dma-requests:
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - '#dma-cells'
  - dma-channels
  - dma-requests

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,ums9117-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dma-controller@20100000 {
        compatible = "sprd,ums9117-dma";
        reg = <0x20100000 0x2100>;
        interrupts = <GIC_SPI 50 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&apahb_gate CLK_DMA_EB>;
        clock-names = "enable";
        #dma-cells = <1>;
        dma-channels = <32>;
        dma-requests = <2>;
    };
...
