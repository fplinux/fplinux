%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/sprd,ums9117-sc2720-poweroff.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Guarded SC2720 power-off on UMS9117

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Power-off through the shared UMS9117 ADI provider. The final SC2720
  sequence is refused while the charger input is active. Holding KEY_POWER
  on the referenced physical keypad for five seconds requests an orderly
  userspace shutdown; failure does not force power loss.

properties:
  compatible:
    const: sprd,ums9117-sc2720-poweroff

  fplinux,keypad:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Physical keypad whose KEY_POWER can request orderly shutdown

required:
  - compatible
  - fplinux,keypad

additionalProperties: false

examples:
  - |
    poweroff {
        compatible = "sprd,ums9117-sc2720-poweroff";
        fplinux,keypad = <&keypad>;
    };
