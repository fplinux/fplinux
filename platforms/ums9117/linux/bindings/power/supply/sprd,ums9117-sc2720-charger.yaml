%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/sprd,ums9117-sc2720-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC2720 charger status on UMS9117

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Read-only observation of the SC2720 charger-present status through the
  UMS9117 analog-die interface. No charger-control interface is provided.

properties:
  compatible:
    const: sprd,ums9117-sc2720-charger

required:
  - compatible

additionalProperties: false

examples:
  - |
    charger {
        compatible = "sprd,ums9117-sc2720-charger";
    };
