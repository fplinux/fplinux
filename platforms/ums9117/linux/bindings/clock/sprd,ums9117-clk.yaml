%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,ums9117-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 clock controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Clock providers for the UMS9117 application clocks, always-on APB,
  application APB and application AHB register banks. The I2C0 clock provider
  selects the 26 MHz source with divider one. While prepared, the AP clock
  provider owns the three-bit SDIO0 selector, selects its 195 MHz source and
  restores the previous selector value when unprepared. It does not change the
  source PLL. The sensor provider selects and divides an inherited 48 MHz
  source, enables the sensor gate while prepared, and restores the prior
  selector, divider and gate state when unprepared. It does not control the
  inherited source. The clock indices are defined in
  dt-bindings/clock/sprd,ums9117-clk.h.

allOf:
  - if:
      properties:
        compatible:
          enum:
            - sprd,ums9117-ap-clk
            - sprd,ums9117-ap-i2c0-clk
            - sprd,ums9117-aon-sensor-clk
    then:
      required:
        - reg
      properties:
        sprd,syscon: false
    else:
      required:
        - sprd,syscon
      properties:
        reg: false

  - if:
      properties:
        compatible:
          const: sprd,ums9117-aon-sensor-clk
    then:
      required:
        - sprd,aon-apb
        - clocks
        - clock-names
    else:
      properties:
        sprd,aon-apb: false
        clocks: false
        clock-names: false

properties:
  compatible:
    enum:
      - sprd,ums9117-ap-clk
      - sprd,ums9117-ap-i2c0-clk
      - sprd,ums9117-aon-sensor-clk
      - sprd,ums9117-aonapb-gate
      - sprd,ums9117-apapb-gate
      - sprd,ums9117-apahb-gate

  reg:
    maxItems: 1

  sprd,syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the syscon containing the gate registers.

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the always-on APB syscon containing the sensor gate.

  clocks:
    maxItems: 1

  clock-names:
    const: source

  "#clock-cells":
    const: 1

required:
  - compatible
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    clock-controller@2150006c {
        compatible = "sprd,ums9117-ap-clk";
        reg = <0x2150006c 0x4>;
        #clock-cells = <1>;
    };

    aon_apb: syscon@402e0000 {
        compatible = "sprd,ums9117-aon-apb", "syscon";
        reg = <0x402e0000 0x3000>;
    };

    aonapb-gate {
        compatible = "sprd,ums9117-aonapb-gate";
        sprd,syscon = <&aon_apb>;
        #clock-cells = <1>;
    };
