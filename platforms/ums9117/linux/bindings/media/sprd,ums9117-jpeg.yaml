%YAML 1.2
---
$id: http://devicetree.org/schemas/media/sprd,ums9117-jpeg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 DCAM and VSP media block

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  DCAM capture and the VSP memory-to-memory JPEG engines share one register
  aperture, clock gate and interrupt. An optional parallel or serial G0 camera
  input connects to the DCAM endpoint. The driver arbitrates their use while
  streaming.

properties:
  compatible:
    const: sprd,ums9117-jpeg

  reg:
    items:
      - description: DCAM and VSP registers and table SRAM
      - description: Shared AP AHB clock-enable state
      - description: Shared AP AHB clock-enable SET alias
      - description: Shared AP AHB clock-enable CLEAR alias
      - description: Shared AP AHB reset SET alias
      - description: Shared AP AHB reset CLEAR alias
      - description: DCAM clock source and divider
      - description: CPU read and write QoS configuration
      - description: Shared QoS register containing the DCAM read and write fields

  reg-names:
    items:
      - const: jpeg
      - const: ap-ahb-gate-state
      - const: ap-ahb-gate-set
      - const: ap-ahb-gate-clear
      - const: ap-ahb-reset-set
      - const: ap-ahb-reset-clear
      - const: dcam-clock
      - const: cpu-qos
      - const: dcam-qos

  interrupts:
    maxItems: 1

  memory-region:
    maxItems: 1
    description: Reusable DMA pool shared by the frame-moving engines.

  sprd,aon-apb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AON APB syscon containing the camera input route.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          bus-type:
            const: 5
          bus-width:
            const: 8
          hsync-active: true
          vsync-active: true
          pclk-sample: true
          sprd,serial-g0-data-width:
            $ref: /schemas/types.yaml#/definitions/uint32
            const: 1
            description: One-bit camera data on the SoC serial G0 input.
        oneOf:
          - required:
              - bus-type
              - bus-width
              - hsync-active
              - vsync-active
              - pclk-sample
            properties:
              sprd,serial-g0-data-width: false
          - required:
              - sprd,serial-g0-data-width
            properties:
              bus-type: false
              bus-width: false
              hsync-active: false
              vsync-active: false
              pclk-sample: false

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - memory-region
  - sprd,aon-apb

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    jpeg@20c00000 {
        compatible = "sprd,ums9117-jpeg";
        reg = <0x20c00000 0x11a00>,
              <0x20e00000 0x4>,
              <0x20e01000 0x4>,
              <0x20e02000 0x4>,
              <0x20e01004 0x4>,
              <0x20e02004 0x4>,
              <0x21500088 0x4>,
              <0x20e000a4 0x4>,
              <0x20e03058 0x4>;
        reg-names = "jpeg", "ap-ahb-gate-state", "ap-ahb-gate-set",
                    "ap-ahb-gate-clear", "ap-ahb-reset-set",
                    "ap-ahb-reset-clear", "dcam-clock", "cpu-qos",
                    "dcam-qos";
        interrupts = <GIC_SPI 45 IRQ_TYPE_LEVEL_HIGH>;
        memory-region = <&codec_dma>;
        sprd,aon-apb = <&aon_apb>;
    };
