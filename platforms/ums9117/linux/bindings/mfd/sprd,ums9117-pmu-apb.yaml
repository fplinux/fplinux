%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/sprd,ums9117-pmu-apb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: UMS9117 PMU APB system controller

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Shared PMU APB registers for power-domain state, sleep control and reset.
  The mapped range includes the SET and CLEAR aliases used by clients to
  update their own control bits without changing unrelated fields.

properties:
  compatible:
    items:
      - const: sprd,ums9117-pmu-apb
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@402b0000 {
        compatible = "sprd,ums9117-pmu-apb", "syscon";
        reg = <0x402b0000 0x3000>;
    };
