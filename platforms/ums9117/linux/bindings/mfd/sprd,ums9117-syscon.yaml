# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/sprd,ums9117-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9117 system controller register banks

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description:
  Shared always-on APB and application AHB register banks, accessed through
  syscon regmaps by peripheral, clock and reset drivers.

properties:
  compatible:
    items:
      - enum:
          - sprd,ums9117-aon-apb
          - sprd,ums9117-ap-ahb
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@402e0000 {
        compatible = "sprd,ums9117-aon-apb", "syscon";
        reg = <0x402e0000 0x3000>;
    };
