[[linux.dt_config_checks]]
path = "/soc/usb@20200000"
compatible = "sprd,ums9117-musb"
config = "CONFIG_USB_MUSB_UMS9117_COLD"

[[linux.dt_config_checks]]
path = "/soc/usb@20200000"
compatible = "fplinux,ums9117-musb-inherited"
config = "CONFIG_USB_MUSB_UMS9117_INHERITED"

[[linux.dt_config_checks]]
path = "/soc/keypad@40250000"
compatible = "sprd,ums9117-keypad"
config = "CONFIG_KEYBOARD_UMS9117"

[[linux.dt_config_checks]]
path = "/soc/keypad@40250000"
compatible = "sprd,ums9117-keypad"
property = "eic9-gpios"
config = "CONFIG_KEYBOARD_UMS9117_AUX_EIC_KEY"

[[linux.dt_config_checks]]
path = "/soc/mmc@20300000"
compatible = "sprd,ums9117-sdhci"
config = "CONFIG_MMC_SDHCI_UMS9117"

[[linux.dt_config_checks]]
path = "/soc/mmc@20300000"
compatible = "sprd,ums9117-sdhci"
property = "cd-gpios"
config = "CONFIG_MMC_REMOVABLE"

[bootstrap]
vendor_source_lock = "fpdoom_bootstrap"
vendor_cache_name = "fpdoom-bootstrap.tar.gz"
archive_prefix = "fpdoom-{commit}/"
source_destination = "bootstrap"
vendor_destination = "vendor/fpdoom"
output_destination = "out"
lcd_config_destination = "ums9117/lcd_config.h"
kernel_destination = "zImage"
files = [
  "build_t117.make",
  "fpdoom/cmd_def.h",
  "fpdoom/common.c",
  "fpdoom/common.h",
  "fpdoom/include/signal.h",
  "fpdoom/include/stdio.h",
  "fpdoom/include/stdlib.h",
  "fpdoom/libc.c",
  "fpdoom/libc/malloc.h",
  "fpdoom/libc/printf.h",
  "fpdoom/syscode.h",
  "fpdoom/usbio.h",
  "pack_reloc/Makefile",
  "pack_reloc/pack_reloc.c",
  "ums9117/asmcode.s",
  "ums9117/entry.c",
  "ums9117/lcd_spi.h",
  "ums9117/start.s",
  "ums9117/syscode.c",
  "ums9117/syscomm.c",
  "ums9117/usbio.c",
]
patches = [
  "platforms/ums9117/bootstrap/patches/0001-preserve-ram-probe-contents.patch",
  "platforms/ums9117/bootstrap/patches/0002-headless.patch",
  "platforms/ums9117/bootstrap/patches/0003-target-display-transport.patch",
  "platforms/ums9117/bootstrap/patches/0004-linux-owned-input-audio.patch",
  "platforms/ums9117/bootstrap/patches/0005-target-owned-early-init.patch",
]
toolchain = "arm-none-eabi"
lto = 0
pack_reloc = "pack_reloc"
safety_target = "fplinux-safety-check"
build_targets = ["clean", "all", "map"]
load_address = 0x80100000
payload_limit = 0x82000000
backend = "ums9117"

[[bootstrap.shared_copies]]
source = "bootstrap/fplinux-boot-screen"
destination = "fplinux-boot-screen"

[[bootstrap.shared_copies]]
source = "platforms/ums9117/bootstrap/src"
destination = "ums9117-bootstrap"

[[bootstrap.shared_copies]]
source = "platforms/ums9117/bootstrap/build/bootstrap.make"
destination = "ums9117-bootstrap/bootstrap.make"

[[bootstrap.shared_copies]]
source = "platforms/ums9117/bootstrap/build/ums9117-linux.ld"
destination = "ums9117-bootstrap/ums9117-linux.ld"

[[bootstrap.shared_copies]]
source = "include/fplinux/fplinux-handoff-protocol.h"
destination = "ums9117-bootstrap/fplinux-handoff-protocol.h"

[[bootstrap.shared_copies]]
source = "platforms/ums9117/common/ums9117-boot-contract.h"
destination = "ums9117-common/ums9117-boot-contract.h"

[[bootstrap.linux_copies]]
source = "lib/fonts/font_6x8.c"
destination = "fplinux-boot-screen/font_6x8.c"

[[bootstrap.linux_copies]]
source = "lib/fonts/font_7x14.c"
destination = "fplinux-boot-screen/font_7x14.c"

[bootstrap.layout]
ram_base = 0x80000000
ram_size = 0x04000000
kernel_load = 0x82000000
kernel_entry = 0x82000000
kernel_size = 0x01200000
fdt_load = 0x83e00000
fdt_size = 0x00010000
framebuffer = 0x83f00000
framebuffer_size = 0x00100000
timer_hz = 1000

[runtime]
fdl1_load_address = 0x00006200

[runtime.adapter]
brightness = 50
rotation = 0
handoff_wait_seconds = 60
usb_release_wait_seconds = 10

[runtime.usb.bootrom]
vendor_id = 0x1782
product_id = 0x4d00
wait_seconds = 300

[runtime.usb.linux_gadget]
vendor_id = 0x0525
product_id = 0xa4a6
keyboard_interface = 0
wait_seconds = 60

[host]
[host.runtime_tools]
loader = "spd_dump"
bridge = "libc_server"
keyboard = "fplinux-usb-keyboard"

[[host.tools]]
type = "make-archive"
name = "spd_dump"
source_lock = "spreadtrum_flash"
cache_name = "spreadtrum_flash.tar.gz"
archive_prefix = "spreadtrum_flash-{commit}/"
source_directory = "spd_dump"
binary = "spd_dump"
link = "static-libusb"
copies = []
patches = []
self_test = false

[[host.tools.members]]
path = "Makefile"
digest_key = "makefile_sha256"

[[host.tools.members]]
path = "spd_dump.c"
digest_key = "spd_dump_c_sha256"

[[host.tools.members]]
path = "spd_cmd.h"
digest_key = "spd_cmd_h_sha256"

[[host.tools]]
type = "make-archive"
name = "libc_server"
source_lock = "fpdoom_host"
cache_name = "fpdoom-host.tar.gz"
archive_prefix = "fpdoom-{commit}/libc_server/"
source_directory = "libc_server"
binary = "libc_server"
link = "static-libusb"
patches = ["platforms/ums9117/host/0001-libc-server-fplinux-handoff.patch"]
self_test = true

[[host.tools.members]]
path = "Makefile"
digest_key = "makefile_sha256"

[[host.tools.members]]
path = "libc_server.c"
digest_key = "libc_server_c_sha256"

[[host.tools.members]]
path = "cmd_def.h"
digest_key = "cmd_def_h_sha256"

[[host.tools.copies]]
source = "include/fplinux/fplinux-handoff-protocol.h"
destination = "fplinux-handoff-protocol.h"

[[host.tools]]
type = "cc-libusb"
name = "fplinux-usb-keyboard"
source = "common/host/fplinux-usb-keyboard.c"
self_test = true

# Reads the stock firmware tables for contributor board reports. It
# uses no libusb symbols; the static link keeps the binary self-contained.
[[host.tools]]
type = "make-archive"
name = "fphelper_t117"
source_lock = "spreadtrum_flash"
cache_name = "spreadtrum_flash.tar.gz"
archive_prefix = "spreadtrum_flash-{commit}/fphelper_t117/"
source_directory = "fphelper_t117"
binary = "fphelper_t117"
link = "static-libusb"
copies = []
patches = ["platforms/ums9117/host/0002-fphelper-extended-keymap.patch"]
self_test = false

[[host.tools.members]]
path = "Makefile"
digest_key = "fphelper_t117_makefile_sha256"

[[host.tools.members]]
path = "main.c"
digest_key = "fphelper_t117_main_c_sha256"

[[host.tools]]
type = "make-archive"
name = "ums9117-nand-ecc"
source_lock = "bch"
