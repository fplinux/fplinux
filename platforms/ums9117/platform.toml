# SPDX-License-Identifier: GPL-2.0-only
name = "ums9117"

[rootfs]
packages = ["fplinux-cpuclock", "fplinux-ssh", "fplinux-usb-gadget"]

[bundle]
packages = ["fplinux-tyrquake", "fplinux-micropythonos"]

[linux]
source_lock = "linux"
arch = "arm"
cross_compile = "arm-none-eabi-"
analysis_cross_compile = "arm-none-eabi-"
config_script = "scripts/config"
image_output = "arch/arm/boot/zImage"
dtb_output_directory = "arch/arm/boot/dts"
targets = ["zImage", "dtbs"]
patches = [
  "platforms/ums9117/kernel/0001-ums9117-platform.patch",
  "platforms/ums9117/kernel/0002-ums9117-dt-bindings.patch",
]

[[linux.copies]]
source = "platforms/ums9117/kernel/Kconfig"
destination = "arch/arm/mach-ums9117/Kconfig"

[[linux.copies]]
source = "platforms/ums9117/kernel/Makefile"
destination = "arch/arm/mach-ums9117/Makefile"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-machine.c"
destination = "arch/arm/mach-ums9117/ums9117.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-timer.c"
destination = "arch/arm/mach-ums9117/ums9117-timer.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-adi.c"
destination = "arch/arm/mach-ums9117/ums9117-adi.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-adi.h"
destination = "include/linux/soc/sprd/ums9117-adi.h"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-musb.c"
destination = "drivers/usb/musb/ums9117.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/font-fplinux.c"
destination = "lib/fonts/font_6x8.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-keypad.c"
destination = "drivers/input/keyboard/ums9117-keypad.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-fb.h"
destination = "drivers/video/fbdev/ums9117-fb.h"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-fb-internal.h"
destination = "drivers/video/fbdev/ums9117-fb-internal.h"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-fb-core.c"
destination = "drivers/video/fbdev/ums9117-fb-core.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-fb-spi.c"
destination = "drivers/video/fbdev/ums9117-fb-spi.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/ums9117-fb-lcm.c"
destination = "drivers/video/fbdev/ums9117-fb-lcm.c"

[[linux.copies]]
source = "platforms/ums9117/kernel/clk-ums9117-inherited.c"
destination = "drivers/clk/sprd/clk-ums9117-inherited.c"

[[linux.copies]]
source = "platforms/ums9117/dts/ums9117.dtsi"
destination = "arch/arm/boot/dts/unisoc/ums9117.dtsi"

[[linux.copies]]
source = "platforms/ums9117/dts/ums9117-ram-session.dtsi"
destination = "arch/arm/boot/dts/unisoc/ums9117-ram-session.dtsi"

[[linux.copies]]
source = "platforms/ums9117/dts/ums9117-musb-cold.dtsi"
destination = "arch/arm/boot/dts/unisoc/ums9117-musb-cold.dtsi"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ram-session.yaml"
destination = "Documentation/devicetree/bindings/firmware/fplinux,ram-session.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-syscounter.yaml"
destination = "Documentation/devicetree/bindings/timer/fplinux,ums9117-syscounter.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-musb.yaml"
destination = "Documentation/devicetree/bindings/usb/fplinux,ums9117-musb.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-aon-apb.yaml"
destination = "Documentation/devicetree/bindings/mfd/fplinux,ums9117-aon-apb.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-keypad.yaml"
destination = "Documentation/devicetree/bindings/input/fplinux,ums9117-keypad.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-fb.yaml"
destination = "Documentation/devicetree/bindings/display/fplinux,ums9117-fb.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-inherited-clocks.yaml"
destination = "Documentation/devicetree/bindings/clock/fplinux,ums9117-inherited-clocks.yaml"

[[linux.copies]]
source = "platforms/ums9117/bindings/fplinux,ums9117-inherited-clk.h"
destination = "include/dt-bindings/clock/fplinux,ums9117-inherited-clk.h"

[[linux.appends]]
source = "platforms/ums9117/kernel/inherited-clk.Kconfig"
destination = "drivers/clk/sprd/Kconfig"

[[linux.appends]]
source = "platforms/ums9117/kernel/inherited-clk.Makefile"
destination = "drivers/clk/sprd/Makefile"

[[linux.appends]]
source = "platforms/ums9117/kernel/fbdev.Kconfig"
destination = "drivers/video/fbdev/Kconfig"

[[linux.appends]]
source = "platforms/ums9117/kernel/fbdev.Makefile"
destination = "drivers/video/fbdev/Makefile"

[bootstrap]
vendor_source_lock = "fpdoom_bootstrap"
vendor_cache_name = "fpdoom-bootstrap.tar.gz"
archive_prefix = "fpdoom-{commit}/"
source_destination = "bootstrap"
vendor_destination = "vendor/fpdoom"
output_destination = "out"
pack_reloc = "pack_reloc"
safety_target = "fplinux-safety-check"
build_targets = ["clean", "all", "map"]
files = [
  "build_t117.make",
  "fpdoom/cmd_def.h",
  "fpdoom/common.c",
  "fpdoom/common.h",
  "fpdoom/include/signal.h",
  "fpdoom/include/stdio.h",
  "fpdoom/include/stdlib.h",
  "fpdoom/libc.c",
  "fpdoom/libc/malloc.h",
  "fpdoom/libc/printf.h",
  "fpdoom/syscode.h",
  "fpdoom/usbio.h",
  "pack_reloc/Makefile",
  "pack_reloc/pack_reloc.c",
  "ums9117/asmcode.s",
  "ums9117/entry.c",
  "ums9117/lcd_config.h",
  "ums9117/lcd_spi.h",
  "ums9117/start.s",
  "ums9117/syscode.c",
  "ums9117/syscomm.c",
  "ums9117/usbio.c",
]
kernel_destination = "zImage"
load_address = 0x80100000
payload_limit = 0x82000000
toolchain = "arm-none-eabi"
lto = 0

[[bootstrap.shared_copies]]
source = "bootstrap/fplinux-boot-screen"
destination = "fplinux-boot-screen"

[[bootstrap.shared_copies]]
source = "platforms/ums9117/bootstrap"
destination = "ums9117-bootstrap"

[runtime]
fdl1_load_address = 0x00006200

[runtime.adapter]
brightness = 50
rotation = 0
handoff_wait_seconds = 60
release_wait_seconds = 10

[runtime.usb.bootrom]
vendor_id = 0x1782
product_id = 0x4d00
wait_seconds = 300

[runtime.usb.linux_gadget]
vendor_id = 0x0525
product_id = 0xa4a6
wait_seconds = 60
keyboard_interface = 0

[host]

[host.runtime_tools]
loader = "spd_dump"
bridge = "libc_server"
keyboard = "fplinux-usb-keyboard"

[[host.tools]]
type = "make-archive"
name = "spd_dump"
source_lock = "spreadtrum_flash"
cache_name = "spreadtrum_flash.tar.gz"
archive_prefix = "spreadtrum_flash-{commit}/"
source_directory = "spd_dump"
binary = "spd_dump"
link = "static-libusb"

[[host.tools.members]]
path = "Makefile"
digest_key = "makefile_sha256"

[[host.tools.members]]
path = "spd_dump.c"
digest_key = "spd_dump_c_sha256"

[[host.tools.members]]
path = "spd_cmd.h"
digest_key = "spd_cmd_h_sha256"

[[host.tools]]
type = "make-archive"
name = "libc_server"
source_lock = "fpdoom_host"
cache_name = "fpdoom-host.tar.gz"
archive_prefix = "fpdoom-{commit}/libc_server/"
source_directory = "libc_server"
binary = "libc_server"
link = "static-libusb"

[[host.tools.members]]
path = "Makefile"
digest_key = "makefile_sha256"

[[host.tools.members]]
path = "libc_server.c"
digest_key = "libc_server_c_sha256"

[[host.tools.members]]
path = "cmd_def.h"
digest_key = "cmd_def_h_sha256"

[[host.tools]]
type = "cc-libusb"
name = "fplinux-usb-keyboard"
source = "common/host/fplinux-usb-keyboard.c"
self_test = true
