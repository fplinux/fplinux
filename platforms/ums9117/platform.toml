# SPDX-License-Identifier: GPL-2.0-only
[identity]
vendor = "Unisoc"
soc = "UMS9117"
aliases = ["T117"]
compatible = "sprd,ums9117"

[rootfs]
packages = [
  "fplinux-apk-tools",
  "fplinux-cpuclock",
  "fplinux-ssh",
  "fplinux-usb-gadget",
  "fplinux-rotate",
  "fplinux-jpeg",
  "fplinux-present",
  "fplinux-bluetooth",
  "fplinux-glib",
  "fplinux-libical",
]

[bundle]
packages = [
  "fplinux-charge",
  "fplinux-micropythonos",
  "fplinux-micropythonos-storage",
  "fplinux-showcase",
  "fplinux-tyrquake",
]

