destination = "board/fplinux/ums9117/ums9117-sdio-slot.c"

[linux]
source_lock = "linux"
arch = "arm"
cross_compile = "arm-none-eabi-"
analysis_cross_compile = "arm-none-eabi-"
defconfig = "platforms/ums9117/linux/config/defconfig"
