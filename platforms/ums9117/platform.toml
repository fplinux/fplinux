# SPDX-License-Identifier: GPL-2.0-only
[identity]
vendor = "Unisoc"
soc = "UMS9117"
aliases = ["T117"]
compatible = "sprd,ums9117"

[rootfs]
packages = [
  "fplinux-alsa-lib",
  "fplinux-apk-tools",
  "fplinux-bluetooth",
  "fplinux-bluez",
  "fplinux-bluez-glib",
  "fplinux-cpuclock",
  "fplinux-dropbear",
  "fplinux-fm",
  "fplinux-jpeg",
  "fplinux-present",
  "fplinux-rotate",
  "fplinux-ssh",
  "fplinux-uclient",
  "fplinux-usb-gadget",
  "fplinux-xkb",
]

[bundle]
packages = [
  "fplinux-bluealsa",
  "fplinux-bluez-libs",
  "fplinux-brightness-ui",
  "fplinux-charge",
  "fplinux-ffmpeg",
  "fplinux-ncurses-curses",
  "fplinux-sbc",
  "fplinux-showcase",
  "fplinux-tyrquake",
]

[uboot]
source = "platforms/ums9117/uboot/u-boot.lock.toml"
archive_prefix = "u-boot-2026.07"
patches = ["platforms/ums9117/uboot/integration.patch"]
required_config = [
  "CONFIG_TARGET_FPLINUX_UMS9117=y",
  'CONFIG_BOOTCOMMAND="sdboot"',
]

[[uboot.copies]]
source = "platforms/ums9117/uboot/board.Kconfig"
destination = "board/fplinux/ums9117/Kconfig"

[[uboot.copies]]
source = "platforms/ums9117/uboot/board.Makefile"
destination = "board/fplinux/ums9117/Makefile"

[[uboot.copies]]
