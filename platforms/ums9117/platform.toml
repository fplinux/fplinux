destination = "board/fplinux/ums9117/board.c"

[[uboot.copies]]
source = "platforms/ums9117/uboot/ums9117.h"
destination = "include/configs/ums9117.h"

[[uboot.copies]]
source = "platforms/ums9117/uboot/ums9117-u-boot.dtsi"
