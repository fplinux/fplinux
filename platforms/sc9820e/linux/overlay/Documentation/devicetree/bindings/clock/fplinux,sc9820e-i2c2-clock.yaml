%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/fplinux,sc9820e-i2c2-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC9820E I2C2 oscillator clock observation and module gate

maintainers:
  - FPLinux <fplinux@users.noreply.github.com>

description: |
  Clock index 0 reports the inherited oscillator input with no divider.
  It reports zero for other parent or divider settings and never changes them.
  Clock index 1 controls the I2C2 AP-APB module gate.

properties:
  compatible:
    const: fplinux,sc9820e-i2c2-clock

  reg:
    maxItems: 1

  "#clock-cells":
    const: 1

  clocks:
    maxItems: 1

  clock-names:
    const: source

  fplinux,ap-apb-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared AP-APB register map with atomic set and clear aliases.

required:
  - compatible
  - reg
  - "#clock-cells"
  - clocks
  - clock-names
  - fplinux,ap-apb-syscon

additionalProperties: false
