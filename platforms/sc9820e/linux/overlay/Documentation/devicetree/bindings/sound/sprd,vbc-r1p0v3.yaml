%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sprd,vbc-r1p0v3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum VBC r1p0v3 register bank

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  VBC control registers and capture FIFO. The SC9820E microphone capture
  consumer maps this bank through its sprd,vbc phandle.

properties:
  compatible:
    const: sprd,vbc-r1p0v3

  reg:
    maxItems: 1
    description: VBC register and FIFO window, at least 0x10000 bytes.

required:
  - compatible
  - reg

additionalProperties: false
