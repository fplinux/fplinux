%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sprd,sharkl2-audio-codec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SharkL2 digital audio codec registers

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  The SC9820E microphone capture route maps this digital codec bank through
  its sprd,digital-codec phandle and controls it together with the VBC bank.

properties:
  compatible:
    const: sprd,sharkl2-audio-codec

  reg:
    maxItems: 1
    description: Digital audio codec register window, at least 0x2000 bytes.

required:
  - compatible
  - reg

additionalProperties: false
