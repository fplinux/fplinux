%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/fplinux,sc9820e-pub.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC9820E public memory controller registers

maintainers:
  - FPLinux <fplinux@users.noreply.github.com>

description: |
  Shared PUB registers include the memory-controller dummy word used during
  connectivity processor startup. Consumers receive this register map through
  a phandle and preserve fields owned by other users.

properties:
  compatible:
    items:
      - const: fplinux,sc9820e-pub
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
