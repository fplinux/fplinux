%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/fplinux,sc9820e-audio-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC9820E shared PMU register window

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Shared PMU registers for audio oscillator requests and WCN power, reset
  and sleep controls. Consumers access their fields through a
  sprd,pmu-syscon phandle, including SET and CLEAR aliases.

properties:
  compatible:
    items:
      - const: fplinux,sc9820e-audio-pmu
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
