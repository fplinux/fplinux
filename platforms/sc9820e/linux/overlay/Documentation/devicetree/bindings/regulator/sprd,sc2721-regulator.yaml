%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/sprd,sc2721-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc SC2721 core, storage and connectivity voltage regulators

maintainers:
  - FPLinux <fplinux@users.noreply.github.com>

description: |
  The SC2721 eMMC core, SD core and I/O regulators have separate enable controls and
  256 voltage selectors from 1.2 V to 3.75 V in 10 mV steps.
  The shared core regulator reports its inherited voltage and remains on.
  WIFIPA has 256 voltage selectors from 1.2 V to 3.75 V in 10 mV steps.
  CON has 81 voltage selectors from 1.1 V to 1.6 V in 6.25 mV steps.

properties:
  compatible:
    const: sprd,sc2721-regulator

  reg:
    minItems: 1
    maxItems: 6

  regulators:
    type: object
    additionalProperties: false

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

      dcdc@1:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        properties:
          reg:
            const: 1
          regulator-name:
            const: vddcore
          regulator-always-on: true
          regulator-min-microvolt: false
          regulator-max-microvolt: false
        required:
          - reg
          - regulator-always-on

      ldo@10:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        properties:
          reg:
            const: 10
          regulator-name:
            const: vddemmccore
        required:
          - reg

      ldo@11:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        properties:
          reg:
            const: 11
          regulator-name:
            const: vddsdcore
        required:
          - reg

      ldo@12:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        properties:
          reg:
            const: 12
          regulator-name:
            const: vddsdio
        required:
          - reg

      ldo@14:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        properties:
          reg:
            const: 14
          regulator-name:
            const: vddwifipa
        required:
          - reg

      ldo@18:
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        properties:
          reg:
            const: 18
          regulator-name:
            const: vddcon
        required:
          - reg

    required:
      - "#address-cells"
      - "#size-cells"
      - ldo@11
      - ldo@12

required:
  - compatible
  - regulators

additionalProperties: false
...
