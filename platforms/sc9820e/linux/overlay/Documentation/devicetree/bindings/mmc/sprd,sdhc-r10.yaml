%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/sprd,sdhc-r10.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum r10 SD and read-only eMMC controllers

maintainers:
  - FPLinux <fplinux@users.noreply.github.com>

allOf:
  - $ref: sdhci-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: fplinux,sc9820e-emmc-ro
    then:
      properties:
        bus-width:
          const: 1
        no-mmc: false
        no-sd: true
        non-removable: true
        vqmmc-supply: false
        cap-mmc-hw-reset: false
      required:
        - bus-width
        - no-sd
        - non-removable
    else:
      properties:
        no-sd: false
        non-removable: false
      required:
        - no-mmc
        - vqmmc-supply

properties:
  compatible:
    oneOf:
      - const: sprd,sdhc-r10
      - items:
          - const: fplinux,sc9820e-emmc-ro
          - const: sprd,sdhc-r10

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: SDIO source multiplexer
      - description: 26 MHz oscillator input
      - description: AP-AHB gate

  clock-names:
    items:
      - const: sdio_clk
      - const: sdio_clk_source
      - const: sdio_ahb_enable

  bus-width:
    enum: [1, 4]

  max-frequency:
    maximum: 13000000

  voltage-ranges:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    maxItems: 1
    items:
      items:
        - description: Minimum slot voltage in mV
          const: 3000
        - description: Maximum slot voltage in mV
          const: 3000

  non-removable: true
  no-sd: true
  no-mmc: true
  no-sdio: true
  no-1-8-v: true
  vmmc-supply: true
  vqmmc-supply: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - max-frequency
  - no-sdio
  - no-1-8-v
  - vmmc-supply

unevaluatedProperties: false
