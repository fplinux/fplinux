%YAML 1.2
---
$id: http://devicetree.org/schemas/input/fplinux,sc9820e-keypad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SC9820E v1 matrix keypad

maintainers:
  - FPLinux <fplinux@users.noreply.github.com>

allOf:
  - $ref: matrix-keymap.yaml#

properties:
  compatible:
    const: fplinux,sc9820e-keypad

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  keypad,num-rows:
    minimum: 1
    maximum: 8

  keypad,num-columns:
    minimum: 1
    maximum: 8

  linux,keymap:
    minItems: 1
    maxItems: 64

  fplinux,aon-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared AON register map with atomic set and clear aliases.

  fplinux,debounce-count:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Raw debounce counter value written to the controller.

required:
  - compatible
  - reg
  - interrupts
  - keypad,num-rows
  - keypad,num-columns
  - linux,keymap
  - fplinux,aon-syscon
  - fplinux,debounce-count

unevaluatedProperties: false
