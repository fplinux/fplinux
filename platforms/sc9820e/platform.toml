# SPDX-License-Identifier: GPL-2.0-only
[identity]
vendor = "Unisoc"
soc = "SC9820E"
aliases = []
compatible = "sprd,sc9820e"

[rootfs]
packages = [
  "fplinux-alsa-lib",
  "fplinux-apk-tools",
  "fplinux-dropbear",
  "fplinux-ssh",
  "fplinux-uclient",
  "fplinux-usb-gadget",
  "fplinux-xkb",
]

[bundle]
packages = ["fplinux-example-apidemo"]

[linux]
source_lock = "linux"
arch = "arm"
cross_compile = "arm-none-eabi-"
analysis_cross_compile = "arm-none-eabi-"
defconfig = "platforms/sc9820e/linux/config/defconfig"
build_types = { debug = "platforms/sc9820e/linux/config/debug.config", release = "platforms/sc9820e/linux/config/release.config" }
config_script = "scripts/config"
dts_directory = "arch/arm/boot/dts/unisoc"
platform_identity_header = "arch/arm/mach-sc9820e/fplinux-platform-identity.h"
targets = ["Image", "dtbs"]
image_output = "arch/arm/boot/Image"
dtb_output_directory = "arch/arm/boot/dts"
patches = [
  "platforms/shared/linux/patches/0001-sprd-pmic.patch",
  "platforms/shared/linux/patches/0002-sprd-adi.patch",
  "platforms/shared/linux/patches/0003-sprd-gpio.patch",
  "platforms/shared/linux/patches/0004-sprd-hwspinlock.patch",
  "platforms/shared/linux/patches/0005-sprd-bindings.patch",
  "platforms/shared/linux/patches/0006-sc27xx-regulators.patch",
  "platforms/shared/linux/patches/0007-sc27xx-rtc.patch",
  "platforms/shared/linux/patches/0008-sc27xx-adc-efuse.patch",
  "platforms/shared/linux/patches/0009-sc27xx-vibrator.patch",
  "platforms/shared/linux/patches/0010-input-events.patch",
  "platforms/shared/linux/patches/0011-sprd-dma.patch",
  "platforms/shared/linux/patches/0012-dmatest-lifetime.patch",
  "platforms/shared/linux/patches/0013-sprd-peripheral-bindings.patch",
  "platforms/shared/linux/patches/0014-sprd-i2c.patch",
  "platforms/shared/linux/patches/0015-sprd-ap-efuse.patch",
  "platforms/shared/linux/patches/0016-sprd-mailbox.patch",
  "platforms/sc9820e/linux/patches/0010-sc9820e-spi.patch",
  "platforms/sc9820e/linux/patches/0011-sc9820e-sdhci.patch",
  "platforms/sc9820e/linux/patches/0012-mipi-dbi-errors.patch",
  "platforms/sc9820e/linux/patches/0013-sc2721-adc-efuse.patch",
  "platforms/sc9820e/linux/patches/0014-sc2721-poweroff.patch",
  "platforms/sc9820e/linux/patches/0015-sc9820e-i2c.patch",
  "platforms/sc9820e/linux/patches/0016-sc9820e-panfrost.patch",
  "platforms/sc9820e/linux/patches/0017-sc9820e-bindings.patch",
  "platforms/sc9820e/linux/patches/0018-sc9820e-s2idle.patch",
  "platforms/sc9820e/linux/patches/0019-sc9820e-spi32.patch",
]
overlay = "platforms/sc9820e/linux/overlay"

[[linux.copies]]
source = "platforms/shared/linux/overlay/include/linux/spi/sprd-adi.h"
destination = "include/linux/spi/sprd-adi.h"

[[linux.copies]]
source = "platforms/shared/linux/overlay/drivers/regulator/sc27xx-regulator-core.c"
destination = "drivers/regulator/sc27xx-regulator-core.c"

[[linux.copies]]
source = "platforms/shared/linux/overlay/drivers/regulator/sc27xx-regulator-core.h"
destination = "drivers/regulator/sc27xx-regulator-core.h"

[[linux.copies]]
source = "platforms/shared/linux/overlay/include/linux/soc/sprd/vbc-fifo.h"
destination = "include/linux/soc/sprd/vbc-fifo.h"

[[linux.copies]]
source = "include/fplinux/fplinux-keypad.h"
destination = "include/dt-bindings/input/fplinux-keypad.h"

[[linux.copies]]
source = "platforms/ums9117/linux/overlay/arch/arm/boot/dts/unisoc/ums9117-ram-session.dtsi"
destination = "arch/arm/boot/dts/unisoc/fplinux-ram-session.dtsi"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/arch/arm/Kconfig"
destination = "arch/arm/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/arch/arm/Makefile"
destination = "arch/arm/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/dts/unisoc.Makefile"
destination = "arch/arm/boot/dts/unisoc/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/clk/sprd/sc9820e-clk.Kconfig"
destination = "drivers/clk/sprd/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/clk/sprd/sc9820e-clk.Makefile"
destination = "drivers/clk/sprd/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/input/keyboard/sc9820e-keypad.Kconfig"
destination = "drivers/input/keyboard/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/input/keyboard/sc9820e-keypad.Makefile"
destination = "drivers/input/keyboard/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/video/backlight/sc2721-backlight.Kconfig"
destination = "drivers/video/backlight/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/video/backlight/sc2721-backlight.Makefile"
destination = "drivers/video/backlight/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/regulator/sc2721-regulator.Kconfig"
destination = "drivers/regulator/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/regulator/sc2721-regulator.Makefile"
destination = "drivers/regulator/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/leds/sc2721-kpled.Kconfig"
destination = "drivers/leds/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/leds/sc2721-kpled.Makefile"
destination = "drivers/leds/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/power/reset/sc2721-poweroff.Kconfig"
destination = "drivers/power/reset/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/power/reset/sc2721-poweroff.Makefile"
destination = "drivers/power/reset/Makefile"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/misc/aw87339.Kconfig"
destination = "drivers/misc/Kconfig"

[[linux.appends]]
source = "platforms/sc9820e/linux/fragments/drivers/misc/aw87339.Makefile"
destination = "drivers/misc/Makefile"

[[linux.dt_config_checks]]
path = "/clock-controller@60100004"
compatible = "fplinux,sc9820e-gpu-clock"
config = "CONFIG_SC9820E_GPU_CLOCK"

[[linux.dt_config_checks]]
path = "/gpu@60000000"
compatible = "sprd,sc9820e-mali"
config = "CONFIG_DRM_PANFROST"

[[linux.dt_config_checks]]
path = "/clock-controller@403f0000"
compatible = "fplinux,sc9820e-cpu-clock"
config = "CONFIG_SC9820E_CPU_CLOCK"

[[linux.dt_config_checks]]
path = "/clock-controller@2150003c"
compatible = "fplinux,sc9820e-i2c2-clock"
config = "CONFIG_SC9820E_I2C2_CLOCK"

[[linux.dt_config_checks]]
path = "/i2c@70700000"
compatible = "sprd,sc9820e-i2c"
config = "CONFIG_I2C_SPRD"

[[linux.dt_config_checks]]
path = "/dma-controller@20100000"
compatible = "sprd,sc9820e-dma"
config = "CONFIG_SPRD_DMA"

[[linux.dt_config_checks]]
path = "/spi@40380000"
compatible = "sprd,r3p0-adi"
config = "CONFIG_SPI_SPRD_ADI"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0"
compatible = "sprd,sc2721"
config = "CONFIG_MFD_SC27XX_PMIC"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0/rtc@200"
compatible = "sprd,sc2721-rtc"
config = "CONFIG_RTC_DRV_SC27XX"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0/efuse@300"
compatible = "sprd,sc2721-efuse"
config = "CONFIG_NVMEM_SC27XX_EFUSE"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0/adc@400"
compatible = "sprd,sc2721-adc"
config = "CONFIG_SC27XX_ADC"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0/keypad-backlight@eac"
compatible = "sprd,sc2721-kpled-ldo"
config = "CONFIG_LEDS_SC2721_KPLED"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0/vibrator@eb4"
compatible = "sprd,sc2721-vibrator"
config = "CONFIG_INPUT_SC27XX_VIBRA"

[[linux.dt_config_checks]]
path = "/spi@40380000/pmic@0/poweroff"
compatible = "sprd,sc2721-poweroff"
config = "CONFIG_POWER_RESET_SC2721"

[[linux.dt_config_checks]]
path = "/keypad@40250000"
compatible = "fplinux,sc9820e-keypad"
config = "CONFIG_KEYBOARD_SC9820E"

[[linux.dt_config_checks]]
path = "/gpio@40280000"
compatible = "sprd,sc9820e-gpio"
config = "CONFIG_GPIO_SPRD"

[[linux.dt_config_checks]]
path = "/mmc@20300000"
compatible = "sprd,sdhc-r10"
config = "CONFIG_MMC_SDHCI_SPRD"

[[linux.dt_config_checks]]
path = "/efuse@40240000"
compatible = "sprd,sc9820e-efuse"
config = "CONFIG_NVMEM_SPRD_EFUSE"

[[linux.dt_config_checks]]
path = "/mailbox@400a0000"
compatible = "sprd,sc9820e-mailbox"
config = "CONFIG_SPRD_MBOX"

[bootstrap]
toolchain = "arm-none-eabi"
backend = "sc9820e"

[runtime.adapter]
handoff_wait_seconds = 60
usb_release_wait_seconds = 10

[runtime.usb.bootrom]
vendor_id = 0x1782
product_id = 0x4d00
wait_seconds = 300

[runtime.usb.linux_gadget]
vendor_id = 0x0525
product_id = 0xa4a6
keyboard_interface = 0
wait_seconds = 60

[host.runtime_tools]
loader = "spd_dump"

[[host.tools]]
type = "make-archive"
name = "spd_dump"
source_lock = "spreadtrum_flash"
archive_prefix = "spreadtrum_flash-{commit}/"
source_directory = "spd_dump"
binary = "spd_dump"
link = "static-libusb"
copies = []
patches = ["platforms/sc9820e/host/0001-spd-dump-selected-usb-final-exec.patch"]
self_test = false

[[host.tools.members]]
path = "Makefile"
digest_key = "makefile_sha256"

[[host.tools.members]]
path = "spd_dump.c"
digest_key = "spd_dump_c_sha256"

[[host.tools.members]]
path = "spd_cmd.h"
digest_key = "spd_cmd_h_sha256"
