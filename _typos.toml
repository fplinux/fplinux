[files]
extend-exclude = [
  ".git/",
  ".cache/",
  "node_modules/",
  "THIRD_PARTY_LICENSES/",
  "*.bin",
  "*.jpg",
  "*.png",
  "*.zip",
]

[default]
extend-ignore-re = ["\\b[0-9a-f]{7,}\\b"]

[default.extend-identifiers]
FPLinux = "FPLinux"
MMIO = "MMIO"
MKE2FS = "MKE2FS"
mke2fs = "mke2fs"
parm = "parm"
UMS9117 = "UMS9117"

[default.extend-words]
MIS = "MIS"
THM = "THM"
fbcon = "fbcon"
initramfs = "initramfs"
microSD = "microSD"
mis = "mis"
mke = "mke"
musl = "musl"
thm = "thm"
