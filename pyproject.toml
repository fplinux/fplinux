[tool.ruff]
target-version = "py311"
line-length = 99
cache-dir = ".cache/ruff"
extend-exclude = [".cache", "node_modules"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C901",
  "COM812",
  "CPY001",
  "D103",
  "D203",
  "D213",
  "EM102",
  "PLR0912",
  "PLR0915",
  "PLR2004",
  "S603",
  "S606",
  "S607",
  "T201",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT009", "PT027"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
cache_dir = "/tmp/mypy"
mypy_path = "scripts"
python_version = "3.11"
strict = true
